<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f0f4f8; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0;
            --neon-blue: #0284c7; --neon-purple: #7e22ce; --neon-green: #16a34a; --neon-red: #dc2626;
            --nav-bg: rgba(255, 255, 255, 0.9); --shadow-card: 0 4px 12px rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --bg-main: #090d16; --bg-card: rgba(22, 30, 49, 0.75); --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: rgba(255, 255, 255, 0.08);
            --neon-blue: #0ea5e9; --neon-purple: #a855f7; --neon-green: #10b981; --neon-red: #ef4444;
            --nav-bg: rgba(15, 22, 42, 0.85); --shadow-card: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px 15px 90px 15px; transition: 0.3s ease; }
        .glass-card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 20px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .profile-container { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: white; border: 2px solid var(--border-color); overflow: hidden;}
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .user-meta h2 { margin: 0; font-size: 19px; font-weight: 700; }
        .user-meta p { margin: 3px 0 0 0; color: var(--text-muted); font-size: 12px; }
        .theme-btn { background: rgba(128,128,128,0.1); border: 1px solid var(--border-color); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .streak-badge { background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; padding: 6px 12px; border-radius: 12px; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 4px 10px rgba(234, 88, 12, 0.3); margin-top:8px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-box { background: rgba(128, 128, 128, 0.05); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; text-align: center; }
        .stat-box .count { font-size: 22px; font-weight: 800; display: block; color: var(--neon-blue); }
        .stat-box .label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: rgba(128, 128, 128, 0.04); margin-bottom: 10px; border-radius: 14px; border-left: 4px solid var(--neon-blue); cursor: pointer; transition: 0.2s; }
        .item-row:active { transform: scale(0.98); }
        .item-row.paid-type { border-left-color: var(--neon-purple); }
        .item-row.demo-item { border-left-color: var(--neon-green); }
        .item-row b { font-size: 14px; display: block; word-break: break-word; }
        .item-row small { font-size: 11px; color: var(--text-muted); display: block; margin-top: 3px; }
        .badge { padding: 5px 9px; border-radius: 7px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
        .bg-blue { background: rgba(14, 165, 233, 0.15); color: var(--neon-blue); }
        .bg-purple { background: rgba(168, 85, 247, 0.15); color: var(--neon-purple); }
        .bg-green { background: rgba(16, 185, 129, 0.15); color: var(--neon-green); }
        h3 { font-size: 15px; margin: 0 0 14px 0; color: var(--text-main); }
        .bottom-nav { position: fixed; bottom: 16px; left: 16px; right: 16px; height: 64px; background: var(--nav-bg); backdrop-filter: blur(30px); border: 1px solid var(--border-color); border-radius: 20px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 9999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; font-size: 10px; font-weight: 600; text-decoration: none;}
        .nav-item.active { color: var(--neon-blue); }
    </style>
</head>
<body data-theme="dark">
    <div class="header-top">
        <div class="profile-container">
            <div class="avatar" id="avatar-box"><img id="user-avatar" src=""><span id="avatar-letters">U</span></div>
            <div class="user-meta">
                <h2 id="profile-name">Client</h2>
                <p id="profile-id">ID: Fetching...</p>
                <div class="streak-badge" id="streak-box" style="display:none;"><i class="fa-solid fa-fire"></i> <span id="streak-count">0</span> Day Streak</div>
            </div>
        </div>
        <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
    </div>

    <div class="stats-grid">
        <div class="stat-box"><span class="count" id="cnt-my">0</span><span class="label">Subscribed</span></div>
        <div class="stat-box"><span class="count" style="color:var(--neon-green);" id="cnt-demo">0</span><span class="label">Active Trials</span></div>
    </div>

    <div class="glass-card" id="demo-card-sec" style="display: none;">
        <h3><i class="fa-solid fa-clock"></i> Active Trial Accounts</h3>
        <div id="demo-list"></div>
    </div>

    <div class="glass-card">
        <h3><i class="fa-solid fa-book-open"></i> My Subscribed Batches</h3>
        <div id="user-batches-list"><p style="color: var(--text-muted); font-size: 13px;">Loading communities...</p></div>
    </div>

    <div class="bottom-nav">
        <a href="/" class="nav-item active"><i class="fa-solid fa-house" style="font-size:18px; margin-bottom:4px;"></i><span>Home</span></a>
        <a href="/explore" class="nav-item"><i class="fa-solid fa-compass" style="font-size:18px; margin-bottom:4px;"></i><span>Explore</span></a>
        <a href="/admin_panel" class="nav-item" id="btn-nav-admin" style="display:none;"><i class="fa-solid fa-shield-halved" style="font-size:18px; margin-bottom:4px;"></i><span>Admin</span></a>
        <a href="/owner_panel" class="nav-item" id="btn-nav-owner" style="display:none;"><i class="fa-solid fa-crown" style="font-size:18px; margin-bottom:4px;"></i><span>Owner</span></a>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let uid = tg.initDataUnsafe?.user?.id || 9999999; 
        let uName = tg.initDataUnsafe?.user?.first_name || "User";
        
        window.onload = () => {
            let saved = localStorage.getItem('edtech_theme') || 'dark';
            document.body.setAttribute('data-theme', saved);
            document.getElementById("theme-icon").className = saved === 'dark' ? "fa-solid fa-moon" : "fa-solid fa-sun";
        }
        function toggleTheme() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            let body = document.body;
            let theme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', theme);
            localStorage.setItem('edtech_theme', theme);
            document.getElementById("theme-icon").className = theme === 'dark' ? "fa-solid fa-moon" : "fa-solid fa-sun";
        }

        document.getElementById("profile-name").innerText = uName;
        document.getElementById("profile-id").innerText = "ID: " + uid;
        let img = document.getElementById("user-avatar"), letters = document.getElementById("avatar-letters");
        img.src = '/api/user/avatar/' + uid;
        img.onload = () => { img.style.display = "block"; letters.style.display = "none"; };
        img.onerror = () => { letters.innerText = uName.charAt(0); letters.style.display="inline";};

        function openBatch(chatId) {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            tg.openTelegramLink("https://t.me/c/" + String(chatId).replace("-100", "") + "/1");
        }

        fetch('/api/user/' + uid).then(res => res.json()).then(data => {
            if (data.is_admin || data.is_owner) document.getElementById("btn-nav-admin").style.display = "flex";
            if (data.is_owner) document.getElementById("btn-nav-owner").style.display = "flex";

            if(data.user_info && data.user_info.streak > 0) {
                document.getElementById("streak-box").style.display = "inline-flex";
                document.getElementById("streak-count").innerText = data.user_info.streak;
            }

            if (data.demos && data.demos.length > 0) {
                document.getElementById("demo-card-sec").style.display = "block";
                document.getElementById("cnt-demo").innerText = data.demos.filter(d => !d.is_expired).length;
                document.getElementById("demo-list").innerHTML = data.demos.map(d => 
                    `<div class="item-row ${d.is_expired?'':'demo-item'}" onclick="openBatch('${d.id}')"><div><b>${d.name}</b><br><small>Ends: ${d.expiry_date}</small></div><span class="badge bg-green">${d.time_left_hours}h</span></div>`
                ).join("");
            }
            document.getElementById("cnt-my").innerText = data.my_batches.length;
            document.getElementById("user-batches-list").innerHTML = data.my_batches.length > 0 ? data.my_batches.map(b => 
                `<div class="item-row ${b.type==='Premium Core'?'paid-type':''}" onclick="openBatch('${b.id}')"><div><b>${b.name}</b><br><small>${b.category}</small></div><span class="badge ${b.type==='Premium Core'?'bg-purple':'bg-blue'}">${b.status}</span></div>`
            ).join("") : `<p style="color:var(--text-muted);font-size:13px;">No active batches.</p>`;
        });
    </script>
</body>
</html>
