<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f4f4f5; --bg-surface: #ffffff; --border-subtle: #e4e4e7;
            --text-primary: #09090b; --text-secondary: #71717a; --accent-main: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.15); --success: #10b981; --warning: #f59e0b;
            --dock-bg: rgba(255, 255, 255, 0.85); --dock-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg-base: #000000; --bg-surface: #111111; --border-subtle: #27272a;
            --text-primary: #fafafa; --text-secondary: #a1a1aa; --accent-main: #6366f1;
            --dock-bg: rgba(24, 24, 27, 0.85); --dock-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background: var(--bg-base); color: var(--text-primary); margin: 0; padding: 0 16px 120px 16px; transition: 0.4s; }
        
        .top-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 24px 0 16px 0; }
        .greeting-area h1 { font-size: 28px; font-weight: 800; margin: 0; line-height: 1.1; letter-spacing: -0.5px; }
        .greeting-area p { margin: 4px 0 0 0; color: var(--text-secondary); font-size: 14px; font-weight: 500; }
        
        .bento-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 20px; margin-bottom: 16px; transition: 0.3s; }
        .section-title { font-size: 18px; font-weight: 800; margin: 0 0 16px 0; color: var(--text-primary); display: flex; align-items: center; gap: 8px;}
        
        .item-row { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .item-row b { font-size: 15px; font-weight: 700; color: var(--text-primary); display: block;}
        .item-row small { font-size: 12px; color: var(--text-secondary); font-weight: 500; display: block; margin-top: 4px; }
        
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; flex-shrink: 0; text-transform: uppercase;}
        .bg-blue { background: rgba(99, 102, 241, 0.15); color: var(--accent-main); }
        .bg-purple { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
        .bg-green { background: rgba(16, 185, 129, 0.15); color: var(--success); }

        .floating-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: max-content; padding: 8px 16px; background: var(--dock-bg); backdrop-filter: blur(24px); border: 1px solid var(--border-subtle); border-radius: 100px; display: flex; gap: 20px; z-index: 9999; box-shadow: var(--dock-shadow); transition: 0.3s;}
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-item i { font-size: 18px; transition: 0.3s; }
        .nav-item.active { background: var(--accent-main); color: white; box-shadow: 0 8px 20px var(--accent-glow); transform: translateY(-10px); }
    </style>
</head>
<body data-theme="dark">
    
    <div class="top-header">
        <div class="greeting-area">
            <h1 id="profile-name">Hello!</h1>
            <p>Ready to learn today?</p>
        </div>
        <button onclick="window.location.href='/profile'" style="background:var(--bg-surface); border:1px solid var(--border-subtle); width:44px; height:44px; border-radius:50%; color:var(--text-primary); cursor:pointer;"><i class="fa-solid fa-user"></i></button>
    </div>
    
    <div class="bento-card" style="cursor: pointer; border-left: 4px solid var(--warning); background: linear-gradient(145deg, var(--bg-surface), rgba(245, 158, 11, 0.05));" onclick="window.location.href='/flash'">
        <h3 class="section-title"><i class="fa-solid fa-bolt" style="color:var(--warning);"></i> Daily Flash Arena</h3>
        <p style="color:var(--text-secondary); font-size:14px; margin:0;">Keep your streak alive. Tap to solve today's challenge!</p>
    </div>

    <div class="bento-card" id="demo-card-sec" style="display: none;">
        <h3 class="section-title"><i class="fa-solid fa-clock-rotate-left" style="color:var(--success);"></i> Active Trials</h3>
        <div id="demo-list"></div>
    </div>
    
    <div>
        <h3 class="section-title"><i class="fa-solid fa-layer-group" style="color:var(--accent-main);"></i> Subscribed Batches</h3>
        <div id="user-batches-list"><p style="color:var(--text-secondary); font-size:14px;">Loading...</p></div>
    </div>

    <div class="floating-dock">
        <a href="/" class="nav-item active"><i class="fa-solid fa-house"></i></a>
        <a href="/explore" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="/quiz" class="nav-item"><i class="fa-solid fa-file-signature"></i></a>
        <a href="/flash" class="nav-item"><i class="fa-solid fa-bolt"></i></a>
        <a href="/leaderboard" class="nav-item"><i class="fa-solid fa-trophy"></i></a>
        <a href="/profile" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let uid = tg.initDataUnsafe?.user?.id || 9999999;
        let uName = tg.initDataUnsafe?.user?.first_name || "User";
        
        let startParam = tg.initDataUnsafe?.start_param;
        if (startParam === "flash") window.location.href = "/flash";

        window.onload = () => {
            document.body.setAttribute('data-theme', localStorage.getItem('edtech_theme') || 'dark');
            document.getElementById("profile-name").innerText = "Hi, " + uName + "!";
        }
        function openBatch(chatId) {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            tg.openTelegramLink("https://t.me/c/" + String(chatId).replace("-100", "") + "/1");
        }
        
        fetch('/api/user/' + uid).then(res => res.json()).then(data => {
            if (data.demos && data.demos.length > 0) {
                document.getElementById("demo-card-sec").style.display = "block";
                document.getElementById("demo-list").innerHTML = data.demos.map(d => 
                    `<div class="item-row" onclick="openBatch('${d.id}')"><div><b>${d.name}</b><small>Ends: ${d.expiry_date}</small></div><span class="badge bg-green">${d.time_left_hours}h</span></div>`
                ).join("");
            }
            document.getElementById("user-batches-list").innerHTML = data.my_batches.length > 0 ? data.my_batches.map(b => 
                `<div class="item-row" style="${b.type==='Premium Core'?'border-left: 4px solid #a855f7;':''}" onclick="openBatch('${b.id}')"><div><b>${b.name}</b><small>${b.category}</small></div><span class="badge ${b.type==='Premium Core'?'bg-purple':'bg-blue'}">${b.status}</span></div>`
            ).join("") : `<div style="text-align:center; padding: 30px;"><p style="color:var(--text-secondary); font-size:14px; margin:0;">No active communities yet.</p></div>`;
        });
    </script>
</body>
</html>
