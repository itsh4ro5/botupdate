<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>H4R Premium Player</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- FASTEST CDNS (No Fallback Loops) -->
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.22.2/browser/bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/big-integer@1.6.52/BigInteger.min.js"></script>

    <style>
      :root {
        --bg: #060708;
        --text: #f5f6f8;
        --accent: #4fc3ff;
        --accent-grad: linear-gradient(135deg, #4fc3ff 0%, #22e6c5 100%);
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; }
      .hidden { display: none !important; }

      #app {
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #050607;
      }
      .player {
        position: relative; width: 100%; max-width: 1040px; height: 80vh;
        background: #000; border-radius: 20px; overflow: hidden;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.85);
      }
      .video-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .player video {
        display: block; width: 100%; height: 100%; background: #000;
        object-fit: contain; cursor: pointer;
      }

      .player-status {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: rgba(6, 7, 8, 0.95); z-index: 10;
      }
      .loader { position: relative; width: 56px; height: 56px; }
      .loader .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); animation: spinCW 1s linear infinite; }
      @keyframes spinCW { to { transform: rotate(360deg); } }

      .player-status-text {
        font-size: 14px; font-weight: 600; color: var(--text); text-align: center;
        background: rgba(255,255,255,0.1); padding: 8px 18px; border-radius: 999px;
      }
      .back-top-btn { position: absolute; top: 16px; left: 16px; z-index: 100; display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: rgba(0,0,0,0.6); color: white; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; font-weight: 600; cursor: pointer; }

      .watermark {
        position: absolute; z-index: 20; color: rgba(255, 255, 255, 0.15);
        font-size: 18px; font-weight: 700; font-family: monospace; letter-spacing: 2px;
        pointer-events: none; user-select: none;
      }

      @media (max-width: 640px) {
        #app { padding: 0; }
        .player { border-radius: 0; max-width: 100%; height: 100vh; }
      }
    </style>
  </head>
  <body>
    
    <button class="back-top-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
    </button>

    <div id="app">
      <div class="player" id="player">
        <div class="video-stage" id="video-stage">
          
          <div class="watermark" id="video-watermark">UID: Connecting...</div>

          <video id="video-player" playsinline controls controlsList="nodownload"></video>

          <div class="player-status" id="player-status">
            <div id="spinner-box"><div class="loader"><div class="ring r1"></div></div></div>
            <span class="player-status-text" id="player-status-text">Starting Engine...</span>
            <div id="action-btn-container" class="mt-4"></div>
          </div>

        </div>
      </div>
    </div>

    <script>
      const tg = window.Telegram ? window.Telegram.WebApp : null;
      if (tg) tg.expand();
      
      // ✅ Fixed UID Extraction (No more NaN)
      const UID = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : 7993892902;
      document.getElementById('video-watermark').innerText = 'UID: ' + UID;

      const urlParams = new URLSearchParams(window.location.search);
      const chatIdParam = urlParams.get('chat');
      const msgIdParam = Number(urlParams.get('msg'));

      function setPlayerStatus(msg, isError = false) {
          document.getElementById('player-status-text').innerHTML = msg;
          if (isError) {
              document.getElementById('spinner-box').classList.add('hidden');
              document.getElementById('action-btn-container').innerHTML = `
                  <button onclick="window.location.href='https://t.me/H4R_Bot'" style="background:var(--accent-grad); color:#000; font-weight:800; padding:12px 24px; border-radius:12px; border:none; cursor:pointer; box-shadow: 0 4px 15px rgba(34,230,197,0.25);">
                      🔐 Open Bot to Login
                  </button>
              `;
          }
      }

      // Dynamic Watermark Position
      function moveWatermark() {
        const stage = document.getElementById('video-stage');
        if (!stage) return;
        const rect = stage.getBoundingClientRect();
        const mark = document.getElementById('video-watermark');
        mark.style.left = Math.max(10, Math.floor(Math.random() * (rect.width - 150))) + 'px';
        mark.style.top = Math.max(10, Math.floor(Math.random() * (rect.height - 30))) + 'px';
      }
      setInterval(moveWatermark, 4000);
      moveWatermark();

      async function startApp() {
          if (!chatIdParam || !msgIdParam) {
              setPlayerStatus("Error: Missing video parameters.", true);
              return;
          }

          if ('serviceWorker' in navigator) {
              try {
                  await navigator.serviceWorker.register('/sw.js?v=21');
                  await navigator.serviceWorker.ready;
              } catch (err) { console.error('SW Error:', err); }
          }

          try {
              setPlayerStatus("Checking Secure Session...");
              const res = await fetch(`/api/session/get/${UID}`);
              const data = await res.json();
              
              if (data.success && data.session) {
                  setPlayerStatus("Extracting Video...");
                  await connectAndStream(data.session);
              } else {
                  setPlayerStatus("🔒 Access Denied.<br><br>Please open the Bot menu and click <b>'Login to Web Player'</b>.", true);
              }
          } catch (e) { 
              setPlayerStatus("Network Error. Please Login via Bot.", true);
          }
      }

      async function connectAndStream(sessionStr) {
          const { TelegramClient } = window.telegram;
          const { StringSession } = window.telegram.sessions;
          const bigIntFn = window.bigInt; 

          const apiId = Number("{{ api_id }}"); 
          const apiHash = "{{ api_hash }}";
          
          const session = new StringSession(sessionStr);
          const DC_HOSTNAMES = {
              1: 'pluto.web.telegram.org', 2: 'venus.web.telegram.org',
              3: 'aurora.web.telegram.org', 4: 'vesta.web.telegram.org', 5: 'flora.web.telegram.org'
          };
          
          const originalSetDC = session.setDC.bind(session);
          session.setDC = (dcId, serverAddress, port, downloadDC) => {
              return originalSetDC(dcId, DC_HOSTNAMES[dcId] || serverAddress, port, downloadDC);
          };
          if (session.dcId && DC_HOSTNAMES[session.dcId]) session.setDC(session.dcId, DC_HOSTNAMES[session.dcId], 443);

          let client = new TelegramClient(session, apiId, apiHash, { connectionRetries: 5, useWSS: true });
          
          try {
              await client.connect();
          } catch (err) {
              setPlayerStatus("Session Expired.<br>Please open the Bot menu and Login to Web Player again.", true);
              return;
          }
          
          const messages = await client.getMessages(chatIdParam, { ids: msgIdParam });
          const media = messages[0]?.media;

          if (!media || !media.document) {
              setPlayerStatus("Error: Video not found in Telegram Channel.", true);
              return;
          }
          
          const fileSize = Number(media.document.size);
          const activeStreams = new Set();

          navigator.serviceWorker.addEventListener('message', async (event) => {
              if (event.data.type === 'CANCEL_STREAM') {
                  activeStreams.delete(event.data.streamId);
                  return;
              }

              if (event.data.type === 'FETCH_RANGE') {
                  const { range, streamId } = event.data;
                  activeStreams.add(streamId);
                  const port = event.ports[0];

                  const parts = range.replace(/bytes=/, "").split("-");
                  const reqStart = parseInt(parts[0], 10) || 0;
                  const reqEnd = parts[1] ? parseInt(parts[1], 10) : fileSize - 1;

                  const ALIGNMENT = 512 * 1024; 
                  const tgStart = Math.floor(reqStart / ALIGNMENT) * ALIGNMENT;
                  const tgEnd = Math.ceil((reqEnd + 1) / ALIGNMENT) * ALIGNMENT - 1;
                  const tgLimit = tgEnd - tgStart + 1;

                  port.postMessage({ type: 'METADATA', start: reqStart, end: reqEnd, totalSize: fileSize });

                  try {
                      let currentOffset = reqStart;
                      let isFirstChunk = true;
                      let currentMedia = media;

                      while (currentOffset <= reqEnd) {
                          if (!activeStreams.has(streamId)) break;
                          
                          const alignedStart = Math.floor(currentOffset / ALIGNMENT) * ALIGNMENT;
                          const alignedEnd = Math.ceil((reqEnd + 1) / ALIGNMENT) * ALIGNMENT - 1;
                          const alignedLimit = alignedEnd - alignedStart + 1;

                          try {
                              for await (const chunk of client.iterDownload({
                                  file: currentMedia, 
                                  offset: bigIntFn(alignedStart), 
                                  limit: bigIntFn(alignedLimit), 
                                  requestSize: ALIGNMENT
                              })) {
                                  if (!activeStreams.has(streamId)) break; 

                                  let bufferToSend = chunk;
                                  if (isFirstChunk) {
                                      const skipBytes = currentOffset - alignedStart;
                                      if (skipBytes > 0) bufferToSend = chunk.slice(skipBytes);
                                      isFirstChunk = false;
                                  }

                                  const maxRemaining = (reqEnd - currentOffset) + 1;
                                  if (bufferToSend.length > maxRemaining) {
                                      bufferToSend = bufferToSend.slice(0, maxRemaining);
                                  }

                                  if (bufferToSend.length > 0) {
                                      const arrayBuffer = new Uint8Array(bufferToSend).buffer;
                                      port.postMessage({ type: 'CHUNK', buffer: arrayBuffer }, [arrayBuffer]);
                                      currentOffset += bufferToSend.length;
                                  }

                                  if (currentOffset > reqEnd) break;
                              }
                              break; 
                          } catch (err) {
                              if (err.message && (err.message.includes('FILE_REFERENCE_EXPIRED') || err.message.includes('FILE_REFERENCE_EMPTY'))) {
                                  const freshMsgs = await client.getMessages(chatIdParam, { ids: msgIdParam });
                                  currentMedia = freshMsgs[0]?.media;
                                  if (!currentMedia) throw new Error("Could not refresh media link.");
                                  isFirstChunk = true; 
                                  continue; 
                              } else {
                                  throw err;
                              }
                          }
                      } 

                      if (activeStreams.has(streamId)) {
                          port.postMessage({ type: 'DONE' });
                          activeStreams.delete(streamId);
                      }
                  } catch (err) {
                      port.postMessage({ type: 'ERROR', error: err.message });
                      activeStreams.delete(streamId);
                  }
              }
          });

          const videoElement = document.getElementById('video-player');
          const VIDEO_ID = "tg_vid_" + msgIdParam;

          // Auto Resume Logic
          videoElement.addEventListener('timeupdate', () => {
              if (videoElement.currentTime > 5 && videoElement.duration) {
                  localStorage.setItem(VIDEO_ID, videoElement.currentTime);
              }
          });
          videoElement.addEventListener('loadedmetadata', () => {
              const savedTime = localStorage.getItem(VIDEO_ID);
              if (savedTime && savedTime < videoElement.duration - 5) {
                  videoElement.currentTime = parseFloat(savedTime);
              }
          });

          videoElement.src = `/tg-stream/video_${msgIdParam}.mp4`;
          
          videoElement.addEventListener('canplay', () => {
              document.getElementById('player-status').classList.add('hidden');
              videoElement.play(); 
          });
      }

      // Check if external scripts loaded, then start
      let checks = 0;
      function checkDeps() {
          if (typeof window.telegram !== 'undefined' && typeof window.bigInt !== 'undefined') {
              startApp();
          } else {
              checks++;
              if (checks > 20) setPlayerStatus("Error: Scripts failed to load. Please check your internet.", true);
              else setTimeout(checkDeps, 500);
          }
      }
      window.addEventListener('load', checkDeps);
    </script>
  </body>
</html>
