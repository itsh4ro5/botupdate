<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Premium Telegram Player</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.22.2/browser/bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/big-integer@1.6.52/BigInteger.min.js"></script>

    <style>
      :root {
        --bg: #060708;
        --surface: rgba(20, 22, 27, 0.72);
        --surface-solid: #14161b;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f5f6f8;
        --text-dim: #9aa1ac;
        --text-faint: #656c78;
        --accent: #4fc3ff;
        --accent-2: #22e6c5;
        --accent-grad: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        --track: rgba(255, 255, 255, 0.16);
        --buffered: rgba(255, 255, 255, 0.34);
        --glow: rgba(79, 195, 255, 0.45);
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 9px;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html, body {
        margin: 0; padding: 0; background: var(--bg); color: var(--text);
        font-family: 'Outfit', 'Inter', sans-serif;
      }

      .hidden { display: none !important; }

      #app {
        min-height: 100vh; display: flex; align-items: center;
        justify-content: center; padding: 24px;
        background:
          radial-gradient(1200px 600px at 15% -10%, rgba(79,195,255,0.08), transparent 60%),
          radial-gradient(1000px 500px at 110% 110%, rgba(34,230,197,0.06), transparent 60%),
          #050607;
      }

      /* --- MAIN PLAYER CONTAINER --- */
      .player {
        position: relative; width: 100%; max-width: 1040px; height: 80vh;
        background: #000; border-radius: var(--radius-lg); overflow: hidden;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255,255,255,0.05);
      }

      .video-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }

      .player video {
        display: block; width: 100%; height: 100%; background: #000;
        object-fit: contain; cursor: pointer; transition: opacity 0.25s ease;
      }

      .player-status {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: rgba(6, 7, 8, 0.85); backdrop-filter: blur(6px);
        transition: opacity 0.3s ease; pointer-events: none; z-index: 5;
      }

      .loader { position: relative; width: 56px; height: 56px; }
      .loader .ring { position: absolute; inset: 0; border-radius: 50%; border: 2.5px solid transparent; }
      .loader .ring.r1 {
        border-top-color: var(--accent); border-right-color: var(--accent);
        animation: spinCW 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .loader .ring.r2 {
        inset: 9px; border-bottom-color: var(--accent-2); border-left-color: var(--accent-2);
        animation: spinCCW 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .loader .core {
        position: absolute; inset: 20px; border-radius: 50%;
        background: var(--accent-grad); opacity: 0.85; box-shadow: 0 0 18px var(--glow);
        animation: pulseCore 1.4s ease-in-out infinite;
      }
      @keyframes spinCW { to { transform: rotate(360deg); } }
      @keyframes spinCCW { to { transform: rotate(-360deg); } }
      @keyframes pulseCore { 0%, 100% { transform: scale(0.85); opacity: 0.6; } 50% { transform: scale(1); opacity: 1; } }

      .player-status-text {
        font-size: 13px; font-weight: 500; letter-spacing: 0.2px; color: var(--text);
        background: rgba(0,0,0,0.35); padding: 6px 14px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.08); font-variant-numeric: tabular-nums;
      }

      .back-top-btn { position: absolute; top: 16px; left: 16px; z-index: 100; display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: rgba(0,0,0,0.6); color: white; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; font-weight: 600; cursor: pointer; backdrop-filter: blur(8px); transition: 0.2s; }
      .back-top-btn:hover { background: rgba(255,255,255,0.1); }
      
      @media (max-width: 640px) {
        #app { padding: 0; }
        .player { border-radius: 0; max-width: 100%; height: 100vh; }
      }
    </style>
  </head>
  <body>
    
    <button class="back-top-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
    </button>

    <!-- ==========================================
         PREMIUM PLAYER CONTAINER
         ========================================== -->
    <div id="app">
      <div class="player hidden" id="player">
        <div class="video-stage" id="video-stage">
          
          <!-- NATIVE VIDEO PLAYER WITH CONTROLS -->
          <video id="video-player" playsinline controls controlsList="nodownload"></video>

          <!-- Loading Status -->
          <div class="player-status" id="player-status">
            <div class="loader"><div class="ring r1"></div><div class="ring r2"></div><div class="core"></div></div>
            <span class="player-status-text" id="player-status-text">Checking Session...</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tg = window.Telegram ? window.Telegram.WebApp : null;
      if (tg) tg.expand();
      
      const UID = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 7993892902;

      // Extract APIs & URL Params
      const { Api, TelegramClient } = telegram;
      const { StringSession } = telegram.sessions;
      
      // 🚨 FIX: Removed 'const bigInt = window.bigInt;' because it was crashing the page!

      const apiId = Number("{{ api_id }}"); 
      const apiHash = "{{ api_hash }}";

      const urlParams = new URLSearchParams(window.location.search);
      const chatIdParam = urlParams.get('chat');
      const msgIdParam = Number(urlParams.get('msg'));

      function setPlayerStatus(msg) { document.getElementById('player-status-text').innerText = msg; }

      // Boot App
      async function startApp() {
          if (!chatIdParam || !msgIdParam) return;

          if ('serviceWorker' in navigator) {
              try {
                  const reg = await navigator.serviceWorker.register('/sw.js?v=12');
                  await navigator.serviceWorker.ready;
              } catch (err) { console.error('SW Error:', err); }
          }

          try {
              setPlayerStatus("Checking Secure Session...");
              const res = await fetch(`/api/session/get/${UID}`);
              const data = await res.json();
              
              if (data.success && data.session) {
                  document.getElementById('player').classList.remove('hidden');
                  await connectAndStream(data.session);
              } else {
                  window.location.href = '/login';
              }
          } catch (e) { 
              window.location.href = '/login';
          }
      }

      // STREAMING ENGINE (GramJS + SW)
      async function connectAndStream(sessionStr) {
          setPlayerStatus("Connecting to Secure DC...");
          const session = new StringSession(sessionStr);
          
          const DC_HOSTNAMES = {
              1: 'pluto.web.telegram.org', 2: 'venus.web.telegram.org',
              3: 'aurora.web.telegram.org', 4: 'vesta.web.telegram.org', 5: 'flora.web.telegram.org'
          };
          const originalSetDC = session.setDC.bind(session);
          session.setDC = (dcId, serverAddress, port, downloadDC) => {
              return originalSetDC(dcId, DC_HOSTNAMES[dcId] || serverAddress, port, downloadDC);
          };
          if (session.dcId && DC_HOSTNAMES[session.dcId]) session.setDC(session.dcId, DC_HOSTNAMES[session.dcId], 443);

          let client = new TelegramClient(session, apiId, apiHash, { connectionRetries: 5, useWSS: true });
          await client.connect();

          setPlayerStatus("Extracting Video...");
          
          const messages = await client.getMessages(chatIdParam, { ids: msgIdParam });
          const media = messages[0]?.media;

          if (!media || !media.document) {
              setPlayerStatus("Error: Video not found or deleted.");
              return;
          }
          
          const fileSize = Number(media.document.size);
          const activeStreams = new Set();

          navigator.serviceWorker.addEventListener('message', async (event) => {
              if (event.data.type === 'CANCEL_STREAM') {
                  activeStreams.delete(event.data.streamId);
                  return;
              }

              if (event.data.type === 'FETCH_RANGE') {
                  const { range, streamId } = event.data;
                  activeStreams.add(streamId);
                  const port = event.ports[0];

                  const parts = range.replace(/bytes=/, "").split("-");
                  const reqStart = parseInt(parts[0], 10) || 0;
                  const reqEnd = parts[1] ? parseInt(parts[1], 10) : fileSize - 1;

                  const ALIGNMENT = 512 * 1024; 
                  const tgStart = Math.floor(reqStart / ALIGNMENT) * ALIGNMENT;
                  const tgEnd = Math.ceil((reqEnd + 1) / ALIGNMENT) * ALIGNMENT - 1;
                  const tgLimit = tgEnd - tgStart + 1;

                  port.postMessage({ type: 'METADATA', start: reqStart, end: reqEnd, totalSize: fileSize });

                  try {
                      let currentOffset = reqStart;
                      let isFirstChunk = true;
                      let currentMedia = media;

                      while (currentOffset <= reqEnd) {
                          if (!activeStreams.has(streamId)) break;
                          
                          const alignedStart = Math.floor(currentOffset / ALIGNMENT) * ALIGNMENT;
                          const alignedEnd = Math.ceil((reqEnd + 1) / ALIGNMENT) * ALIGNMENT - 1;
                          const alignedLimit = alignedEnd - alignedStart + 1;

                          try {
                              for await (const chunk of client.iterDownload({
                                  file: currentMedia, 
                                  offset: bigInt(alignedStart), // bigInt is globally available here
                                  limit: bigInt(alignedLimit), 
                                  requestSize: ALIGNMENT
                              })) {
                                  if (!activeStreams.has(streamId)) break; 

                                  let bufferToSend = chunk;
                                  if (isFirstChunk) {
                                      const skipBytes = currentOffset - alignedStart;
                                      if (skipBytes > 0) bufferToSend = chunk.slice(skipBytes);
                                      isFirstChunk = false;
                                  }

                                  const maxRemaining = (reqEnd - currentOffset) + 1;
                                  if (bufferToSend.length > maxRemaining) {
                                      bufferToSend = bufferToSend.slice(0, maxRemaining);
                                  }

                                  if (bufferToSend.length > 0) {
                                      const arrayBuffer = new Uint8Array(bufferToSend).buffer;
                                      port.postMessage({ type: 'CHUNK', buffer: arrayBuffer }, [arrayBuffer]);
                                      currentOffset += bufferToSend.length;
                                  }

                                  if (currentOffset > reqEnd) break;
                              }
                              break; 
                          } catch (err) {
                              if (err.message && (err.message.includes('FILE_REFERENCE_EXPIRED') || err.message.includes('FILE_REFERENCE_EMPTY'))) {
                                  console.warn("🔄 File Reference Expired Mid-Stream! Auto-refreshing fresh link...");
                                  const freshMsgs = await client.getMessages(chatIdParam, { ids: msgIdParam });
                                  currentMedia = freshMsgs[0]?.media;
                                  if (!currentMedia) throw new Error("Could not refresh media link.");
                                  isFirstChunk = true; 
                                  continue; 
                              } else {
                                  throw err;
                              }
                          }
                      } 

                      if (activeStreams.has(streamId)) {
                          port.postMessage({ type: 'DONE' });
                          activeStreams.delete(streamId);
                      }
                  } catch (err) {
                      if (err.message && !err.message.includes('LIMIT_INVALID')) console.error("Stream Error:", err.message);
                      port.postMessage({ type: 'ERROR', error: err.message });
                      activeStreams.delete(streamId);
                  }
              }
          });

          const videoElement = document.getElementById('video-player');
          videoElement.src = `/tg-stream/video_${msgIdParam}.mp4`;
          
          // Hide Loader when video starts playing
          videoElement.addEventListener('canplay', () => {
              document.getElementById('player-status').classList.add('hidden');
              videoElement.play(); 
          });
      }

      startApp();
    </script>
  </body>
</html>
