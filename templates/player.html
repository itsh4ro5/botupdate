<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>H4R Instant Player</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ONLY 1 CLEAN CDN FOR TELEGRAM ENGINE -->
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.22.2/browser/bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/big-integer@1.6.52/BigInteger.min.js"></script>

    <style>
      body { margin: 0; background: #050607; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
      .player-container { width: 100%; max-width: 1000px; height: 100vh; background: black; position: relative; display: flex; align-items: center; justify-content: center;}
      video { width: 100%; height: 100%; object-fit: contain; }
      
      /* Status Screen */
      .status-box { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; }
      .status-box.hidden { opacity: 0; pointer-events: none; }
      .status-text { font-size: 15px; font-weight: bold; margin-top: 15px; text-align: center; }
      
      /* Back Button */
      .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 8px; color: white; cursor: pointer; z-index: 20; backdrop-filter: blur(5px); }
    </style>
  </head>
  <body>

    <div class="player-container">
      <button class="back-btn" onclick="history.back()">⬅ Back</button>
      
      <video id="video-player" playsinline controls controlsList="nodownload"></video>
      
      <div class="status-box" id="status-box">
        <!-- Simple Spinner -->
        <svg class="animate-spin h-10 w-10 text-[#4fc3ff]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <div class="status-text" id="status-text">Starting Instant Engine...</div>
        <div id="login-btn-container" class="mt-4"></div>
      </div>
    </div>

    <script>
      const tg = window.Telegram ? window.Telegram.WebApp : null;
      if (tg) tg.expand();
      
      const UID = "{{ url_user_id }}" !== "None" ? parseInt("{{ url_user_id }}") : (window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 7993892902);
      
      const urlParams = new URLSearchParams(window.location.search);
      const chatIdParam = urlParams.get('chat');
      const msgIdParam = Number(urlParams.get('msg'));

      function setStatus(msg, isError = false) {
          document.getElementById('status-text').innerHTML = msg;
          if (isError) {
              document.querySelector('.animate-spin').style.display = 'none';
              document.getElementById('login-btn-container').innerHTML = `
                  <button onclick="window.location.href='https://t.me/H4R_Bot'" style="background: linear-gradient(135deg, #4fc3ff, #22e6c5); color: black; font-weight: bold; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; margin-top: 10px;">
                      🔐 Open Bot & Login
                  </button>
              `;
          }
      }

      let loadChecks = 0;
      function waitForEngine() {
          // Agar file aa gayi hai, toh start karo
          if (typeof window.telegram !== 'undefined' && typeof window.bigInt !== 'undefined') {
              startApp();
          } else {
              // Nahi aayi toh 10 second tak wait karo (0.2s * 50)
              loadChecks++;
              if (loadChecks > 50) {
                  setStatus("Brave Shields / Network is blocking the player. Please refresh or turn off shields.", true);
              } else {
                  setTimeout(waitForEngine, 200); 
              }
          }
      }

      window.addEventListener('load', waitForEngine);

      async function startApp() {
          if (!chatIdParam || !msgIdParam) {
              setStatus("Error: Video link is broken.", true);
              return;
          }

          if ('serviceWorker' in navigator) {
              try {
                  await navigator.serviceWorker.register('/sw.js?v=100');
                  await navigator.serviceWorker.ready;
              } catch (err) { console.error('SW Error:', err); }
          }

          try {
              setStatus("Checking Session...");
              const res = await fetch(`/api/session/get/${UID}`);
              const data = await res.json();
              
              if (data.success && data.session) {
                  setStatus("Connecting to Server...");
                  await connectAndStream(data.session); // THE CORE ENGINE CALL
              } else {
                  setStatus("Session not found. Please login from the Bot menu.", true);
              }
          } catch (e) { 
              setStatus("Network Error. Please try again.", true);
          }
      }

      // THE CORE ENGINE
      async function connectAndStream(sessionStr) {
          const { TelegramClient } = window.telegram;
          const { StringSession } = window.telegram.sessions;
          const bigIntFn = window.bigInt; 

          const apiId = Number("{{ api_id }}"); 
          const apiHash = "{{ api_hash }}";
          
          const session = new StringSession(sessionStr);
          const DC_HOSTNAMES = {
              1: 'pluto.web.telegram.org', 2: 'venus.web.telegram.org',
              3: 'aurora.web.telegram.org', 4: 'vesta.web.telegram.org', 5: 'flora.web.telegram.org'
          };
          
          const originalSetDC = session.setDC.bind(session);
          session.setDC = (dcId, serverAddress, port, downloadDC) => {
              return originalSetDC(dcId, DC_HOSTNAMES[dcId] || serverAddress, port, downloadDC);
          };
          if (session.dcId && DC_HOSTNAMES[session.dcId]) session.setDC(session.dcId, DC_HOSTNAMES[session.dcId], 443);

          let client = new TelegramClient(session, apiId, apiHash, { connectionRetries: 3, useWSS: true });
          
          try {
              await client.connect();
          } catch (err) {
              setStatus("Session Expired. Please login from Bot again.", true);
              return;
          }

          setStatus("Extracting Video Streams...");
          
          const messages = await client.getMessages(chatIdParam, { ids: msgIdParam });
          const media = messages[0]?.media;

          if (!media || !media.document) {
              setStatus("Error: Video not found.", true);
              return;
          }
          
          const fileSize = Number(media.document.size);
          const activeStreams = new Set();

          navigator.serviceWorker.addEventListener('message', async (event) => {
              if (event.data.type === 'CANCEL_STREAM') {
                  activeStreams.delete(event.data.streamId);
                  return;
              }

              if (event.data.type === 'FETCH_RANGE') {
                  const { range, streamId } = event.data;
                  activeStreams.add(streamId);
                  const port = event.ports[0];

                  const parts = range.replace(/bytes=/, "").split("-");
                  const reqStart = parseInt(parts[0], 10) || 0;
                  const reqEnd = parts[1] ? parseInt(parts[1], 10) : fileSize - 1;

                  const ALIGNMENT = 512 * 1024; 
                  const tgStart = Math.floor(reqStart / ALIGNMENT) * ALIGNMENT;
                  const tgEnd = Math.ceil((reqEnd + 1) / ALIGNMENT) * ALIGNMENT - 1;
                  const tgLimit = tgEnd - tgStart + 1;

                  port.postMessage({ type: 'METADATA', start: reqStart, end: reqEnd, totalSize: fileSize });

                  try {
                      let currentOffset = reqStart;
                      let isFirstChunk = true;
                      let currentMedia = media;

                      while (currentOffset <= reqEnd) {
                          if (!activeStreams.has(streamId)) break;
                          
                          const alignedStart = Math.floor(currentOffset / ALIGNMENT) * ALIGNMENT;
                          const alignedEnd = Math.ceil((reqEnd + 1) / ALIGNMENT) * ALIGNMENT - 1;
                          const alignedLimit = alignedEnd - alignedStart + 1;

                          try {
                              for await (const chunk of client.iterDownload({
                                  file: currentMedia, 
                                  offset: bigIntFn(alignedStart), 
                                  limit: bigIntFn(alignedLimit), 
                                  requestSize: ALIGNMENT
                              })) {
                                  if (!activeStreams.has(streamId)) break; 

                                  let bufferToSend = chunk;
                                  if (isFirstChunk) {
                                      const skipBytes = currentOffset - alignedStart;
                                      if (skipBytes > 0) bufferToSend = chunk.slice(skipBytes);
                                      isFirstChunk = false;
                                  }

                                  const maxRemaining = (reqEnd - currentOffset) + 1;
                                  if (bufferToSend.length > maxRemaining) {
                                      bufferToSend = bufferToSend.slice(0, maxRemaining);
                                  }

                                  if (bufferToSend.length > 0) {
                                      const arrayBuffer = new Uint8Array(bufferToSend).buffer;
                                      port.postMessage({ type: 'CHUNK', buffer: arrayBuffer }, [arrayBuffer]);
                                      currentOffset += bufferToSend.length;
                                  }

                                  if (currentOffset > reqEnd) break;
                              }
                              break; 
                          } catch (err) {
                              if (err.message && (err.message.includes('FILE_REFERENCE_EXPIRED') || err.message.includes('FILE_REFERENCE_EMPTY'))) {
                                  const freshMsgs = await client.getMessages(chatIdParam, { ids: msgIdParam });
                                  currentMedia = freshMsgs[0]?.media;
                                  if (!currentMedia) throw new Error("Link refresh failed.");
                                  isFirstChunk = true; 
                                  continue; 
                              } else {
                                  throw err;
                              }
                          }
                      } 

                      if (activeStreams.has(streamId)) {
                          port.postMessage({ type: 'DONE' });
                          activeStreams.delete(streamId);
                      }
                  } catch (err) {
                      port.postMessage({ type: 'ERROR', error: err.message });
                      activeStreams.delete(streamId);
                  }
              }
          });

          const videoElement = document.getElementById('video-player');
          videoElement.src = `/tg-stream/video_${msgIdParam}.mp4`;
          
          videoElement.addEventListener('canplay', () => {
              document.getElementById('status-box').classList.add('hidden');
              videoElement.play(); 
          });
      }
    </script>
  </body>
</html>
