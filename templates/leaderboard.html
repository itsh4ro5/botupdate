<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050509" />
  <title>H4R — Leaderboard</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'system-ui', 'sans-serif'] },
          colors: {
            ink: '#050509',
            surface: '#0d0d16',
            indigo: { neon: '#6366f1', soft: '#818cf8' },
            emerald: { neon: '#10b981', soft: '#34d399' },
            gold: '#fbbf24',
            silver: '#94a3b8',
            bronze: '#b45309'
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --bg: #050509;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-strong: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f7;
      --muted: #8b8b9e;
      --indigo: #6366f1;
      --emerald: #10b981;
    }

    html.light {
      --bg: #f3f4f8;
      --surface: rgba(10, 10, 25, 0.03);
      --surface-strong: rgba(10, 10, 25, 0.05);
      --border: rgba(10, 10, 25, 0.08);
      --text: #10101c;
      --muted: #5b5b6b;
    }

    * { -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ambient neon glow behind content */
    .aurora::before {
      content: '';
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.22), transparent 65%);
      filter: blur(30px);
      z-index: 0;
      pointer-events: none;
    }
    .aurora::after {
      content: '';
      position: fixed;
      bottom: -120px;
      right: -80px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.16), transparent 65%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card-press { transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease; }
    .card-press:active { transform: scale(0.965); }

    .text-muted { color: var(--muted); }

    /* dock */
    .dock {
      background: rgba(13, 13, 22, 0.72);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }
    html.light .dock { background: rgba(255, 255, 255, 0.78); }

    .dock-item { transition: color 0.2s ease, transform 0.2s ease; }
    .dock-item.active { color: var(--indigo); }
    .dock-item.active .dock-glow { opacity: 1; transform: scale(1); }
    .dock-glow {
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 0 18px 2px rgba(99, 102, 241, 0.55);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* shimmer skeletons */
    .skel {
      background: linear-gradient(100deg, rgba(255,255,255,0.04) 30%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.04) 70%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite linear;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: floatUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* category tab pills */
    .cat-tab { transition: color 0.2s ease, background 0.25s ease, border-color 0.25s ease, transform 0.18s ease; }
    .cat-tab:active { transform: scale(0.94); }
    .cat-tab.active {
      color: #fff;
      background: linear-gradient(130deg, #4f46e5, #6366f1);
      border-color: transparent;
      box-shadow: 0 8px 22px rgba(99, 102, 241, 0.4);
    }
    html.light .cat-tab.active { color: #fff; }

    /* Podium Glow Effects */
    .rank-1 { background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.3); box-shadow: 0 0 20px rgba(251, 191, 36, 0.1); }
    .rank-2 { background: rgba(148, 163, 184, 0.08); border: 1px solid rgba(148, 163, 184, 0.3); }
    .rank-3 { background: rgba(180, 83, 9, 0.08); border: 1px solid rgba(180, 83, 9, 0.3); }

    .rank-1 .avatar-ring { border-color: var(--gold); box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
    .rank-2 .avatar-ring { border-color: var(--silver); }
    .rank-3 .avatar-ring { border-color: var(--bronze); }
  </style>
</head>

<body class="aurora min-h-screen pb-32">
  <div class="relative z-10 mx-auto w-full max-w-md px-5 pt-6">

    <!-- ===== Header ===== -->
    <header class="flex items-center justify-between reveal">
      <div>
        <p class="text-xs text-muted">Global Rankings</p>
        <h1 class="-mt-0.5 flex items-center gap-2 text-xl font-bold leading-tight">
          <i class="fa-solid fa-trophy text-yellow-400 drop-shadow-md"></i> Hall of Fame
        </h1>
      </div>
      <button id="themeToggle" aria-label="Toggle theme" class="glass card-press flex h-10 w-10 items-center justify-center rounded-full text-base">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <!-- ===== Category Tabs (horizontal scroll) ===== -->
    <section class="reveal mt-6" style="animation-delay:.05s" aria-label="Leaderboard Metrics">
      <div id="catTabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
        <button type="button" data-metric="points" class="cat-tab active glass shrink-0 rounded-full border px-5 py-2.5 text-sm font-semibold text-muted">
          🏆 Top Points
        </button>
        <button type="button" data-metric="accuracy" class="cat-tab glass shrink-0 rounded-full border px-5 py-2.5 text-sm font-semibold text-muted">
          🎯 Accuracy
        </button>
        <button type="button" data-metric="streak" class="cat-tab glass shrink-0 rounded-full border px-5 py-2.5 text-sm font-semibold text-muted">
          🔥 Max Streak
        </button>
      </div>
    </section>

    <!-- ===== Loading State ===== -->
    <div id="loadingBlock" class="mt-6 grid gap-3">
      <div class="skel h-20 rounded-2xl"></div>
      <div class="skel h-20 rounded-2xl"></div>
      <div class="skel h-20 rounded-2xl"></div>
      <div class="skel h-20 rounded-2xl"></div>
    </div>

    <!-- ===== Leaderboard List ===== -->
    <section class="reveal mt-6" style="animation-delay:.1s">
        <div id="leaderboardContainer" class="grid gap-3">
            <!-- Rendered dynamically via JS -->
        </div>
    </section>

    <!-- ===== Empty State ===== -->
    <div id="emptyState" class="mt-10 hidden flex-col items-center text-center">
      <div class="glass flex h-16 w-16 items-center justify-center rounded-2xl text-2xl text-indigo-soft">
        <i class="fa-solid fa-ghost"></i>
      </div>
      <p class="mt-4 font-semibold">No data available yet</p>
      <p class="mt-1 max-w-[240px] text-sm text-muted">Play daily flash arenas or mock tests to register your rank.</p>
    </div>

    <!-- ===== Share Button ===== -->
    <section class="reveal mt-6" style="animation-delay:.15s">
        <button id="shareBtn" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-indigo-neon/15 border border-indigo-neon/30 py-3.5 text-sm font-bold text-indigo-soft shadow-lg card-press">
            <i class="fa-solid fa-share-nodes"></i> Challenge Friends
        </button>
    </section>

  </div>

  <!-- ===== Floating Bottom Dock ===== -->
  <nav class="fixed bottom-4 left-1/2 z-30 -translate-x-1/2">
    <div class="dock flex items-center gap-1 rounded-full px-2 py-2">
      <a href="/" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-house text-[17px]"></i><span class="text-[9px] font-medium">Home</span>
      </a>
      <a href="/explore" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-compass text-[17px]"></i><span class="text-[9px] font-medium">Explore</span>
      </a>
      <a href="/quiz" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-file-pen text-[17px]"></i><span class="text-[9px] font-medium">Quiz</span>
      </a>
      <a href="/flash" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-bolt text-[17px]"></i><span class="text-[9px] font-medium">Flash</span>
      </a>
      <a href="/leaderboard" class="dock-item active relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-ranking-star text-[17px]"></i><span class="text-[9px] font-medium">Rank</span>
      </a>
      <a href="/profile" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-user text-[17px]"></i><span class="text-[9px] font-medium">Profile</span>
      </a>
    </div>
  </nav>

  <script>
    /* ============================================================
       H4R Leaderboard — Vanilla JS controller
       API: GET /api/leaderboard/{metric}
       ============================================================ */
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

    const $ = (id) => document.getElementById(id);
    const haptic = (t) => { if (tg && tg.HapticFeedback) { try { t === 'sel' ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(t); } catch (e) {} } };

    let currentMetric = 'points';
    const BOT_USERNAME = 'H4R_Bot'; 

    /* ---------- Theme toggle ---------- */
    (function initTheme() {
      const saved = localStorage.getItem('h4r_theme');
      if (saved === 'light') document.documentElement.classList.replace('dark', 'light');
      syncThemeIcon();
    })();
    function syncThemeIcon() {
      const light = document.documentElement.classList.contains('light');
      $('themeToggle').innerHTML = light ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f3f4f8' : '#050509');
    }
    $('themeToggle').addEventListener('click', () => {
      const root = document.documentElement;
      root.classList.contains('dark') ? root.classList.replace('dark', 'light') : root.classList.replace('light', 'dark');
      localStorage.setItem('h4r_theme', root.classList.contains('light') ? 'light' : 'dark');
      syncThemeIcon();
      haptic('light');
    });

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ---------- Tab Setup ---------- */
    document.querySelectorAll('.cat-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.classList.contains('active')) return;
            haptic('sel');
            document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMetric = btn.getAttribute('data-metric');
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            fetchLeaderboard(currentMetric);
        });
    });

    /* ---------- Render Rank Card (BUG FIXED) ---------- */
    function buildRankCard(user, index, metric) {
        let isTop3 = index < 3;
        let rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'glass';
        let rankIconOrNum = index === 0 ? '<i class="fa-solid fa-crown text-gold text-lg"></i>' : 
                            index === 1 ? '<i class="fa-solid fa-medal text-silver text-lg"></i>' : 
                            index === 2 ? '<i class="fa-solid fa-medal text-bronze text-lg"></i>' : 
                            `<span class="text-sm font-bold text-muted">#${index + 1}</span>`;

        let valText = metric === 'points' ? `${user.points || 0} XP` : 
                      metric === 'accuracy' ? `${user.accuracy || 0}%` : 
                      `${user.streak || 0} 🔥`;

        let safeName = (user.name && user.name !== "undefined" && user.name !== "Unknown") ? user.name : "Premium User";
        let initial = safeName.charAt(0).toUpperCase();
        let avatarSrc = `/api/user/avatar/${user.uid}`;

        // 🔥 FIX: Initial ko z-0 (peeche) aur Image ko z-10 (aage) rakha hai. 
        // Image fail hui toh bas hide ho jayegi, HTML screen par leak nahi karega.
        return `
        <div class="${rankClass} card-press flex w-full items-center gap-3 rounded-2xl p-3.5 relative overflow-hidden transition-all">
            <div class="flex h-10 w-8 shrink-0 items-center justify-center">
                ${rankIconOrNum}
            </div>
            
            <div class="relative h-10 w-10 shrink-0 flex items-center justify-center rounded-[14px] bg-[#181826]">
                <span class="absolute text-indigo-soft font-bold text-sm z-0">${initial}</span>
                <img src="${avatarSrc}" onerror="this.style.display='none'" class="absolute inset-[2px] h-[36px] w-[36px] rounded-[12px] object-cover z-10"/>
                <div class="${isTop3 ? 'avatar-ring border-[2px]' : 'border border-border'} absolute inset-0 rounded-[14px] z-20 pointer-events-none"></div>
            </div>

            <div class="min-w-0 flex-1">
                <p class="truncate text-sm font-bold leading-tight ${index === 0 ? 'text-gold' : index === 1 ? 'text-silver' : index === 2 ? 'text-bronze' : 'text-text'}">${escapeHtml(safeName)}</p>
                <p class="mt-0.5 text-[11px] font-medium text-muted">ID: ${escapeHtml(user.uid)}</p>
            </div>
            
            <div class="shrink-0">
                <span class="inline-block rounded-xl bg-indigo-neon/15 px-3 py-1.5 text-xs font-bold tracking-wide text-indigo-soft">
                    ${valText}
                </span>
            </div>
        </div>`;
    }
    /* ---------- Fetch Data ---------- */
    async function fetchLeaderboard(metric) {
        $('emptyState').classList.add('hidden');
        $('leaderboardContainer').innerHTML = '';
        $('loadingBlock').classList.remove('hidden');

        try {
            let res = await fetch(`/api/leaderboard/${metric}`);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            let data = await res.json();
            
            $('loadingBlock').classList.add('hidden');

            if (!data || data.length === 0 || data.error) {
                $('emptyState').classList.remove('hidden');
                $('emptyState').classList.add('flex');
                return;
            }

            $('leaderboardContainer').innerHTML = data.map((u, i) => buildRankCard(u, i, metric)).join('');
            
        } catch (e) {
            $('loadingBlock').classList.add('hidden');
            // Fallback Demo Data for preview
            let demoData = [
                { uid: 101, name: "Aarav Sharma", points: 2450, accuracy: 98, streak: 25 },
                { uid: 102, name: "Priya Singh", points: 2100, accuracy: 92, streak: 18 },
                { uid: 103, name: "Rahul Verma", points: 1950, accuracy: 89, streak: 15 },
                { uid: 104, name: "Neha Gupta", points: 1800, accuracy: 85, streak: 12 },
                { uid: 105, name: "Amit Kumar", points: 1650, accuracy: 80, streak: 10 }
            ];
            // Sort demo data based on metric
            demoData.sort((a, b) => b[metric] - a[metric]);
            $('leaderboardContainer').innerHTML = demoData.map((u, i) => buildRankCard(u, i, metric)).join('');
        }
    }

    /* ---------- Share Button Logic ---------- */
    $('shareBtn').addEventListener('click', () => {
      haptic('light');
      const text = `🏆 Check out the Hall of Fame on H4R Bot!\n\nCan you beat the top scores? Compete in Daily Flash Challenges now! 👇`;
      const shareUrl = `https://t.me/${BOT_USERNAME}/App`;
      const url = 'https://t.me/share/url?url=' + encodeURIComponent(shareUrl) + '&text=' + encodeURIComponent(text);
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, '_blank');
    });

    // Initialize
    fetchLeaderboard('points');
  </script>
</body>
</html>
