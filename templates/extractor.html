<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050509" />
  <title>H4R   Resource Extractor</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'system-ui', 'sans-serif'] },
          colors: {
            ink: '#050509',
            surface: '#0d0d16',
            indigo: { neon: '#6366f1', soft: '#818cf8' },
            emerald: { neon: '#10b981', soft: '#34d399' },
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --bg: #050509;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-strong: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f7;
      --muted: #8b8b9e;
      --indigo: #6366f1;
      --emerald: #10b981;
    }
    html.light {
      --bg: #f3f4f8;
      --surface: rgba(10, 10, 25, 0.03);
      --surface-strong: rgba(10, 10, 25, 0.05);
      --border: rgba(10, 10, 25, 0.08);
      --text: #10101c;
      --muted: #5b5b6b;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }
    .aurora::before {
      content: '';
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.22), transparent 65%);
      filter: blur(30px);
      z-index: 0;
      pointer-events: none;
    }
    .aurora::after {
      content: '';
      position: fixed;
      bottom: -120px;
      right: -80px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.16), transparent 65%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }
    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .card-press { transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease; }
    .card-press:active { transform: scale(0.965); }
    .text-muted { color: var(--muted); }
    .dock {
      background: rgba(13, 13, 22, 0.72);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }
    html.light .dock { background: rgba(255, 255, 255, 0.78); }
    .dock-item { transition: color 0.2s ease, transform 0.2s ease; }
    .dock-item.active { color: var(--indigo); }
    .dock-item.active .dock-glow { opacity: 1; transform: scale(1); }
    .dock-glow {
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 0 18px 2px rgba(99, 102, 241, 0.55);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: floatUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .seg {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      border-radius: 9999px;
    }
    .seg-thumb {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      border-radius: 9999px;
      background: linear-gradient(130deg, #4f46e5, #6366f1);
      box-shadow: 0 8px 22px rgba(99, 102, 241, 0.4);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 0;
    }
    .seg[data-active="ca"] .seg-thumb { transform: translateX(100%); }
    .seg-btn {
      position: relative;
      z-index: 1;
      padding: 0.6rem 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      transition: color 0.25s ease;
    }
    .seg-btn.active { color: #fff; }
  </style>
</head>
<body class="aurora min-h-screen pb-32">
  <div class="relative z-10 mx-auto w-full max-w-md px-5 pt-6">
    <!-- Header -->
    <header class="flex items-center justify-between reveal">
      <div>
        <p class="text-xs text-muted">Testbook Bypass Tools</p>
        <h1 class="-mt-0.5 flex items-center gap-2 text-xl font-bold leading-tight">
          <i class="fa-solid fa-wand-magic-sparkles text-indigo-soft"></i> Extractor Hub
        </h1>
      </div>
      <button id="themeToggle" aria-label="Toggle theme" class="glass card-press flex h-10 w-10 items-center justify-center rounded-full text-base">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <!-- Segmented Control Mode Tabs -->
    <div class="reveal mt-5" style="animation-delay:.05s">
      <div id="seg" class="seg glass" data-active="pdf">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button id="tabPdf" class="seg-btn active" onclick="switchMode('pdf')">
          <i class="fa-solid fa-file-pdf mr-1"></i> PDF Study Note
        </button>
        <button id="tabCa" class="seg-btn" onclick="switchMode('ca')">
          <i class="fa-solid fa-newspaper mr-1"></i> Current Affairs
        </button>
      </div>
    </div>

    <!-- URL Input Card -->
    <section class="reveal mt-5" style="animation-delay:.1s">
      <div class="glass rounded-3xl p-5">
        <label id="inputLabel" class="text-xs font-bold uppercase tracking-wider text-indigo-soft block mb-2">
          Enter PDF Viewer or Study Note URL
        </label>
        <div class="relative flex items-center w-full">
          <i class="fa-solid fa-link absolute left-4 text-muted"></i>
          <input type="url" id="targetUrlInput" placeholder="https://testbook.com/pdf-viewer?id=..." 
            class="glass w-full rounded-2xl py-3.5 pl-11 pr-4 text-sm text-text outline-none transition-all placeholder-muted bg-transparent border border-border focus:border-indigo-neon">
        </div>
        <button id="extractBtn" onclick="processExtraction()" class="mt-4 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-indigo-600 to-indigo-neon py-3.5 text-sm font-bold text-white shadow-lg shadow-indigo-600/25 card-press">
          <i class="fa-solid fa-bolt"></i> <span id="btnText">Extract Direct CDN Link</span>
        </button>
      </div>
    </section>

    <!-- Loading State -->
    <div id="loadingBlock" class="mt-6 hidden flex-col items-center text-center">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-soft mb-2"></i>
      <p class="text-sm font-semibold text-muted" id="loadingText">Processing source payload...</p>
    </div>

    <!-- Result Display Card -->
    <section id="resultCard" class="reveal mt-6 hidden" style="animation-delay:.15s">
      <div class="glass rounded-3xl p-5 border-l-4 border-emerald-soft">
        <div class="flex items-center gap-2 text-emerald-soft mb-2">
          <i class="fa-solid fa-circle-check text-base"></i>
          <span class="text-xs font-bold uppercase tracking-wide">Extraction Successful</span>
        </div>
        <h3 id="resultTitle" class="text-base font-bold leading-snug mb-3">Document Title</h3>
        
        <!-- PDF Result Container -->
        <div id="pdfResultArea" class="space-y-2">
          <a id="downloadPdfBtn" href="#" target="_blank" class="flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-neon/20 border border-emerald-neon/40 py-3 text-xs font-bold text-emerald-soft card-press">
            <i class="fa-solid fa-download"></i> Download High-Speed PDF
          </a>
          <button id="copyLinkBtn" onclick="copyCdnUrl()" class="flex w-full items-center justify-center gap-2 rounded-xl glass py-3 text-xs font-bold text-muted card-press">
            <i class="fa-solid fa-copy"></i> Copy CDN Link
          </button>
        </div>

        <!-- Current Affairs Result Container -->
        <div id="caResultArea" class="hidden space-y-2">
          <button id="launchQuizBtn" onclick="launchCaQuiz()" class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-neon py-3 text-xs font-bold text-white shadow-lg card-press">
            <i class="fa-solid fa-rocket"></i> Launch Interactive Quiz Engine
          </button>
        </div>
      </div>
    </section>

    <!-- Error Banner -->
    <div id="errorBanner" class="mt-6 hidden rounded-2xl border border-red-500/30 bg-red-500/10 p-4 text-center text-xs font-semibold text-red-400">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i> <span id="errorMsg">Failed to process resource.</span>
    </div>
  </div>

  <!-- Bottom Navigation Dock -->
  <nav class="fixed bottom-4 left-1/2 z-30 -translate-x-1/2" oncontextmenu="return false;">
    <div class="dock flex items-center gap-1 rounded-full px-2 py-2">
      <div onclick="window.location.href='/'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-house text-[17px]"></i><span class="text-[9px] font-medium">Home</span>
      </div>
      <div onclick="window.location.href='/explore'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-compass text-[17px]"></i><span class="text-[9px] font-medium">Explore</span>
      </div>
      <div onclick="window.location.href='/quiz'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-file-pen text-[17px]"></i><span class="text-[9px] font-medium">Quiz</span>
      </div>
      <div onclick="window.location.href='/flash'" class="dock-item active relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-wand-magic-sparkles text-[17px]"></i><span class="text-[9px] font-medium">Tools</span>
      </div>
      <div onclick="window.location.href='/leaderboard'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-ranking-star text-[17px]"></i><span class="text-[9px] font-medium">Rank</span>
      </div>
      <div onclick="window.location.href='/profile'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-user text-[17px]"></i><span class="text-[9px] font-medium">Profile</span>
      </div>
    </div>
  </nav>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
    const $ = (id) => document.getElementById(id);
    const haptic = (t) => { if (tg && tg.HapticFeedback) { try { t === 'sel' ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(t); } catch (e) {} } };

    let currentMode = 'pdf';
    let extractedCdnUrl = '';
    let compiledQuizHtml = '';

    /* Theme Toggle */
    (function initTheme() {
      const saved = localStorage.getItem('h4r_theme');
      if (saved === 'light') document.documentElement.classList.replace('dark', 'light');
      syncThemeIcon();
    })();

    function syncThemeIcon() {
      const light = document.documentElement.classList.contains('light');
      $('themeToggle').innerHTML = light ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f3f4f8' : '#050509');
    }

    $('themeToggle').addEventListener('click', () => {
      const root = document.documentElement;
      root.classList.contains('dark') ? root.classList.replace('dark', 'light') : root.classList.replace('light', 'dark');
      localStorage.setItem('h4r_theme', root.classList.contains('light') ? 'light' : 'dark');
      syncThemeIcon();
      haptic('light');
    });

    /* Mode Switcher */
    function switchMode(mode) {
      currentMode = mode;
      haptic('sel');
      $('seg').setAttribute('data-active', mode);
      $('tabPdf').classList.toggle('active', mode === 'pdf');
      $('tabCa').classList.toggle('active', mode === 'ca');
      
      $('errorBanner').classList.add('hidden');
      $('resultCard').classList.add('hidden');
      $('targetUrlInput').value = '';

      if (mode === 'pdf') {
        $('inputLabel').textContent = 'Enter PDF Viewer or Study Note URL';
        $('targetUrlInput').placeholder = 'https://testbook.com/pdf-viewer?id=...';
        $('btnText').textContent = 'Extract Direct CDN Link';
      } else {
        $('inputLabel').textContent = 'Enter Current Affairs Quiz URL';
        $('targetUrlInput').placeholder = 'https://testbook.com/current-affairs-quiz/quizzes/...';
        $('btnText').textContent = 'Extract & Compile Quiz Engine';
      }
    }

    /* Core Extraction Logic */
    async function processExtraction() {
      const targetUrl = $('targetUrlInput').value.trim();
      if (!targetUrl) {
        showError("Please paste a valid Testbook URL.");
        return;
      }

      haptic('medium');
      $('errorBanner').classList.add('hidden');
      $('resultCard').classList.add('hidden');
      $('loadingBlock').classList.remove('hidden');
      $('loadingBlock').classList.add('flex');

      if (currentMode === 'pdf') {
        $('loadingText').textContent = "Bypassing PDF viewer and fetching CDN key...";
        try {
          const res = await fetch(`/api/tb/pdf-note?url=${encodeURIComponent(targetUrl)}`);
          const data = await res.json();
          $('loadingBlock').classList.add('hidden');

          if (!res.ok || data.error || !data.pdf_data) {
            showError(data.error || "Failed to extract PDF CDN link.");
            return;
          }

          extractedCdnUrl = data.pdf_data.cdn_url;
          $('resultTitle').textContent = data.pdf_data.title || "Study Note Document";
          $('downloadPdfBtn').href = extractedCdnUrl;
          $('pdfResultArea').classList.remove('hidden');
          $('caResultArea').classList.add('hidden');
          $('resultCard').classList.remove('hidden');

        } catch (e) {
          $('loadingBlock').classList.add('hidden');
          showError("Network error. Could not connect to proxy server.");
        }
      } else {
        $('loadingText').textContent = "Scraping Current Affairs quiz payload...";
        try {
          const res = await fetch('/api/tb/current-affairs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: targetUrl })
          });

          if (!res.ok) {
            const errData = await res.json();
            $('loadingBlock').classList.add('hidden');
            showError(errData.error || "Failed to compile Current Affairs quiz.");
            return;
          }

          compiledQuizHtml = await res.text();
          $('loadingBlock').classList.add('hidden');
          $('resultTitle').textContent = "Daily Current Affairs Interactive Quiz";
          $('pdfResultArea').classList.add('hidden');
          $('caResultArea').classList.remove('hidden');
          $('resultCard').classList.remove('hidden');

        } catch (e) {
          $('loadingBlock').classList.add('hidden');
          showError("Network error. Could not generate quiz engine.");
        }
      }
    }

    function launchCaQuiz() {
      haptic('heavy');
      if (!compiledQuizHtml) return;
      document.open();
      document.write(compiledQuizHtml);
      document.close();
    }

    function copyCdnUrl() {
      if (!extractedCdnUrl) return;
      navigator.clipboard.writeText(extractedCdnUrl).then(() => {
        haptic('light');
        $('copyLinkBtn').innerHTML = '<i class="fa-solid fa-check text-emerald-soft"></i> Link Copied!';
        setTimeout(() => {
          $('copyLinkBtn').innerHTML = '<i class="fa-solid fa-copy"></i> Copy CDN Link';
        }, 2000);
      });
    }

    function showError(msg) {
      haptic('light');
      $('errorMsg').textContent = msg;
      $('errorBanner').classList.remove('hidden');
    }
  </script>
</body>
</html>
