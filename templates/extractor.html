<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050509" />
  <title>H4R - Study Note Extractor</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'system-ui', 'sans-serif'] },
          colors: {
            ink: '#050509',
            surface: '#0d0d16',
            indigo: { neon: '#6366f1', soft: '#818cf8' },
            emerald: { neon: '#10b981', soft: '#34d399' },
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --bg: #050509;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-strong: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f7;
      --muted: #8b8b9e;
      --indigo: #6366f1;
      --emerald: #10b981;
    }
    html.light {
      --bg: #f3f4f8;
      --surface: rgba(10, 10, 25, 0.03);
      --surface-strong: rgba(10, 10, 25, 0.05);
      --border: rgba(10, 10, 25, 0.08);
      --text: #10101c;
      --muted: #5b5b6b;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }
    .aurora::before {
      content: '';
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.22), transparent 65%);
      filter: blur(30px);
      z-index: 0;
      pointer-events: none;
    }
    .aurora::after {
      content: '';
      position: fixed;
      bottom: -120px;
      right: -80px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.16), transparent 65%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }
    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .card-press { transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease; }
    .card-press:active { transform: scale(0.965); }
    .text-muted { color: var(--muted); }
    .dock {
      background: rgba(13, 13, 22, 0.72);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }
    html.light .dock { background: rgba(255, 255, 255, 0.78); }
    .dock-item { transition: color 0.2s ease, transform 0.2s ease; }
    .dock-item.active { color: var(--indigo); }
    .dock-item.active .dock-glow { opacity: 1; transform: scale(1); }
    .dock-glow {
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 0 18px 2px rgba(99, 102, 241, 0.55);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: floatUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
  </style>
</head>
<body class="aurora min-h-screen pb-32">
  <div class="relative z-10 mx-auto w-full max-w-md px-5 pt-6">
    <!-- Header -->
    <header class="flex items-center justify-between reveal">
      <div>
        <p class="text-xs text-muted">Testbook Bypass Tools</p>
        <h1 class="-mt-0.5 flex items-center gap-2 text-xl font-bold leading-tight">
          <i class="fa-solid fa-file-pdf text-indigo-soft"></i> Note Extractor
        </h1>
      </div>
      <button id="themeToggle" aria-label="Toggle theme" class="glass card-press flex h-10 w-10 items-center justify-center rounded-full text-base">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <!-- URL Input Card -->
    <section class="reveal mt-8" style="animation-delay:.1s">
      <div class="glass rounded-3xl p-5">
        <label id="inputLabel" class="text-xs font-bold uppercase tracking-wider text-indigo-soft block mb-2">
          Enter Study Note ID
        </label>
        <div class="relative flex items-center w-full">
          <i class="fa-solid fa-fingerprint absolute left-4 text-muted"></i>
          <input type="text" id="targetUrlInput" placeholder="e.g. 6752f2df1f6a653d5bd24674"
             class="glass w-full rounded-2xl py-3.5 pl-11 pr-4 text-sm text-text outline-none transition-all placeholder-muted bg-transparent border border-border focus:border-indigo-neon">
        </div>
        <button id="extractBtn" onclick="processExtraction()" class="mt-4 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-indigo-600 to-indigo-neon py-3.5 text-sm font-bold text-white shadow-lg shadow-indigo-600/25 card-press">
          <i class="fa-solid fa-bolt"></i> <span id="btnText">Extract Multi-Lingual PDF</span>
        </button>
      </div>
    </section>

    <!-- Loading State -->
    <div id="loadingBlock" class="mt-6 hidden flex-col items-center text-center">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-soft mb-2"></i>
      <p class="text-sm font-semibold text-muted" id="loadingText">Bypassing server and fetching PDF links...</p>
    </div>

    <!-- Result Display Card -->
    <section id="resultCard" class="reveal mt-6 hidden" style="animation-delay:.15s">
      <div class="glass rounded-3xl p-5 border-l-4 border-emerald-soft">
        <div class="flex items-center gap-2 text-emerald-soft mb-2">
          <i class="fa-solid fa-circle-check text-base"></i>
          <span class="text-xs font-bold uppercase tracking-wide">Extraction Successful</span>
        </div>
        <h3 id="resultTitle" class="text-base font-bold leading-snug mb-3">Study Note Document</h3>
        
        <!-- PDF Result Container -->
        <div id="pdfResultArea" class="space-y-2">
          <a id="downloadPdfBtn" href="#" target="_blank" class="flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-neon/20 border border-emerald-neon/40 py-3 text-xs font-bold text-emerald-soft card-press">
            <i class="fa-solid fa-download"></i> Download High-Speed PDF
          </a>
          <button id="copyLinkBtn" onclick="copyCdnUrl()" class="flex w-full items-center justify-center gap-2 rounded-xl glass py-3 text-xs font-bold text-muted card-press">
            <i class="fa-solid fa-copy"></i> Copy CDN Link
          </button>
        </div>
      </div>
    </section>

    <!-- Error Banner -->
    <div id="errorBanner" class="mt-6 hidden rounded-2xl border border-red-500/30 bg-red-500/10 p-4 text-center text-xs font-semibold text-red-400">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i> <span id="errorMsg">Failed to process resource.</span>
    </div>

  </div>

  <!-- Bottom Navigation Dock -->
  <nav class="fixed bottom-4 left-1/2 z-30 -translate-x-1/2" oncontextmenu="return false;">
    <div class="dock flex items-center gap-1 rounded-full px-2 py-2">
      <div onclick="window.location.href='/'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-house text-[17px]"></i><span class="text-[9px] font-medium">Home</span>
      </div>
      <div onclick="window.location.href='/explore'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-compass text-[17px]"></i><span class="text-[9px] font-medium">Explore</span>
      </div>
      <div onclick="window.location.href='/quiz'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-file-pen text-[17px]"></i><span class="text-[9px] font-medium">Quiz</span>
      </div>
      <div onclick="window.location.href='/flash'" class="dock-item active relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-wand-magic-sparkles text-[17px]"></i><span class="text-[9px] font-medium">Tools</span>
      </div>
      <div onclick="window.location.href='/leaderboard'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-ranking-star text-[17px]"></i><span class="text-[9px] font-medium">Rank</span>
      </div>
      <div onclick="window.location.href='/profile'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-user text-[17px]"></i><span class="text-[9px] font-medium">Profile</span>
      </div>
    </div>
  </nav>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
    const $ = (id) => document.getElementById(id);
    const haptic = (t) => { if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} } };

    let extractedCdnUrl = '';

    /* Theme Toggle */
    (function initTheme() {
      const saved = localStorage.getItem('h4r_theme');
      if (saved === 'light') document.documentElement.classList.replace('dark', 'light');
      syncThemeIcon();
    })();
    function syncThemeIcon() {
      const light = document.documentElement.classList.contains('light');
      $('themeToggle').innerHTML = light ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f3f4f8' : '#050509');
    }
    $('themeToggle').addEventListener('click', () => {
      const root = document.documentElement;
      root.classList.contains('dark') ? root.classList.replace('dark', 'light') : root.classList.replace('light', 'dark');
      localStorage.setItem('h4r_theme', root.classList.contains('light') ? 'light' : 'dark');
      syncThemeIcon();
      haptic('light');
    });

    /* Core Extraction Logic for Study Note PDFs */
    async function processExtraction() {
      const targetId = $('targetUrlInput').value.trim();
      if (!targetId) {
        showError("Please enter a valid Study Note ID.");
        return;
      }
      haptic('medium');
      $('errorBanner').classList.add('hidden');
      $('resultCard').classList.add('hidden');
      $('loadingBlock').classList.remove('hidden');
      $('loadingBlock').classList.add('flex');

      try {
        const res = await fetch(`/api/study/note-pdf?note_id=${encodeURIComponent(targetId)}`);
        const data = await res.json();
        
        $('loadingBlock').classList.add('hidden');
        if (!res.ok || data.error || !data.pdf_data) {
          showError(data.error || "Failed to extract PDF CDN link.");
          return;
        }
        
        let pdfUrls = data.pdf_data.urls;
        extractedCdnUrl = pdfUrls["Hindi"] || pdfUrls["English"] || Object.values(pdfUrls)[0];

        $('resultTitle').textContent = data.pdf_data.title || "Study Note Document";
        $('downloadPdfBtn').href = extractedCdnUrl;
        
        $('resultCard').classList.remove('hidden');
      } catch (e) {
        $('loadingBlock').classList.add('hidden');
        showError("Network error. Could not connect to proxy server.");
      }
    }

    function copyCdnUrl() {
      if (!extractedCdnUrl) return;
      navigator.clipboard.writeText(extractedCdnUrl).then(() => {
        haptic('light');
        $('copyLinkBtn').innerHTML = '<i class="fa-solid fa-check text-emerald-soft"></i> Link Copied!';
        setTimeout(() => {
          $('copyLinkBtn').innerHTML = '<i class="fa-solid fa-copy"></i> Copy CDN Link';
        }, 2000);
      });
    }

    function showError(msg) {
      haptic('light');
      $('errorMsg').textContent = msg;
      $('errorBanner').classList.remove('hidden');
    }
  </script>
</body>
</html>
