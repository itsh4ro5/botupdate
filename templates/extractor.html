<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050509" />
  <title>H4R - Study Notes Explorer</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'system-ui', 'sans-serif'] },
          colors: {
            ink: '#050509',
            surface: '#0d0d16',
            indigo: { neon: '#6366f1', soft: '#818cf8' },
            emerald: { neon: '#10b981', soft: '#34d399' },
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --bg: #050509;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-strong: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f7;
      --muted: #8b8b9e;
      --indigo: #6366f1;
      --emerald: #10b981;
    }
    html.light {
      --bg: #f3f4f8;
      --surface: rgba(10, 10, 25, 0.03);
      --surface-strong: rgba(10, 10, 25, 0.05);
      --border: rgba(10, 10, 25, 0.08);
      --text: #10101c;
      --muted: #5b5b6b;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }
    .aurora::before {
      content: '';
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.22), transparent 65%);
      filter: blur(30px);
      z-index: 0;
      pointer-events: none;
    }
    .aurora::after {
      content: '';
      position: fixed;
      bottom: -120px;
      right: -80px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.16), transparent 65%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }
    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .card-press { transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease; }
    .card-press:active { transform: scale(0.965); }
    .text-muted { color: var(--muted); }
    .dock {
      background: rgba(13, 13, 22, 0.72);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }
    html.light .dock { background: rgba(255, 255, 255, 0.78); }
    .dock-item { transition: color 0.2s ease, transform 0.2s ease; }
    .dock-item.active { color: var(--indigo); }
    .dock-item.active .dock-glow { opacity: 1; transform: scale(1); }
    .dock-glow {
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 0 18px 2px rgba(99, 102, 241, 0.55);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: floatUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    
    .breadcrumb-text {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="aurora min-h-screen pb-32">
  <div class="relative z-10 mx-auto w-full max-w-md px-5 pt-6">
    
    <!-- Header -->
    <header class="flex items-center justify-between reveal">
      <div>
        <p class="text-xs text-muted">H4R Study Notes</p>
        <h1 class="-mt-0.5 flex items-center gap-2 text-xl font-bold leading-tight">
          <i class="fa-solid fa-book-open text-indigo-soft"></i> Study Notes
        </h1>
      </div>
      <button id="themeToggle" aria-label="Toggle theme" class="glass card-press flex h-10 w-10 items-center justify-center rounded-full text-base">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <!-- Navigation Breadcrumb -->
    <div id="navBar" class="hidden mt-6 mb-4 flex items-center gap-3">
      <button onclick="goBack()" class="glass flex h-9 w-9 items-center justify-center rounded-xl text-indigo-soft card-press shrink-0">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="glass flex-1 rounded-xl px-4 py-2 flex flex-col justify-center">
        <span class="text-[10px] uppercase font-bold text-muted tracking-wider" id="currentStepLabel">Exams</span>
        <span class="text-sm font-bold breadcrumb-text" id="currentStepTitle">Select Category</span>
      </div>
    </div>

    <!-- Main Content Area -->
    <section class="reveal mt-6" style="animation-delay:.1s">

      <!-- Live Search Box -->
      <div id="searchContainer" class="hidden mb-4 relative reveal">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-muted"></i>
        <input type="text" id="searchInput" oninput="filterItems()" placeholder="Search in this section..."
               class="glass w-full rounded-2xl py-3.5 pl-11 pr-4 text-sm text-text outline-none transition-all placeholder-muted bg-transparent border border-border focus:border-indigo-neon">
      </div>
      
      <!-- Loading State -->
      <div id="loadingBlock" class="mt-10 hidden flex-col items-center text-center">
        <div class="relative flex items-center justify-center h-16 w-16 mb-4">
          <div class="absolute inset-0 rounded-full border-4 border-indigo-neon/20"></div>
          <div class="absolute inset-0 rounded-full border-4 border-indigo-neon border-t-transparent animate-spin"></div>
          <i class="fa-solid fa-cloud-arrow-down text-indigo-soft"></i>
        </div>
        <p class="text-sm font-bold">Syncing Database...</p>
        <p class="text-xs text-muted mt-1" id="loadingText">Fetching resources</p>
      </div>

      <!-- Dynamic Grid for Data (Groups/Subjects/Chapters/Notes) -->
      <div id="dataGrid" class="grid gap-3"></div>

      <!-- Empty State -->
      <div id="emptyState" class="mt-10 hidden flex-col items-center text-center">
        <div class="glass flex h-16 w-16 items-center justify-center rounded-2xl text-2xl text-indigo-soft mb-4">
          <i class="fa-solid fa-folder-open"></i>
        </div>
        <p class="font-bold">No Data Found</p>
        <p class="mt-1 text-sm text-muted" id="emptyStateText">There are no notes available in this section.</p>
      </div>

    </section>
  </div>

  <!-- FULL SCREEN PDF READER OVERLAY -->
  <div id="pdfReaderScreen" class="hidden fixed inset-0 z-[50000] bg-bg flex-col transition-all duration-300">
    <!-- Reader Header -->
    <div class="flex items-center justify-between px-4 py-3 bg-surface border-b border-border shadow-md shrink-0">
      <button onclick="closePdfReader()" class="flex h-10 w-10 items-center justify-center rounded-full glass text-text card-press shrink-0">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2 id="readerTitle" class="text-sm font-bold truncate flex-1 px-4 text-center">Document Title</h2>
      <a id="readerDownloadBtn" href="#" target="_blank" class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-neon/15 text-indigo-soft card-press shrink-0">
        <i class="fa-solid fa-download"></i>
      </a>
    </div>

    <!-- Reader Language Switcher -->
    <div id="readerLangSelector" class="hidden flex gap-2 overflow-x-auto no-scrollbar py-2 px-4 bg-surface/80 border-b border-border shrink-0 backdrop-blur-md">
      <!-- Buttons injected here -->
    </div>

    <!-- Iframe Container (Full remaining height) -->
    <div class="flex-1 w-full relative bg-white">
      <!-- Background loader while PDF renders -->
      <div class="absolute inset-0 flex flex-col items-center justify-center z-0 text-gray-400 bg-white">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
        <span class="text-sm font-bold text-gray-500">Loading High-Speed PDF...</span>
      </div>
      <iframe id="readerIframe" src="" class="absolute inset-0 w-full h-full border-none z-10 bg-transparent"></iframe>
    </div>
  </div>

  <!-- Bottom Navigation Dock -->
  <nav id="bottomDock" class="fixed bottom-4 left-1/2 z-30 -translate-x-1/2 transition-transform duration-300" oncontextmenu="return false;">
    <div class="dock flex items-center gap-1 rounded-full px-2 py-2">
      <div onclick="window.location.href='/'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-house text-[17px]"></i><span class="text-[9px] font-medium">Home</span>
      </div>
      <div onclick="window.location.href='/explore'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-compass text-[17px]"></i><span class="text-[9px] font-medium">Explore</span>
      </div>
    
      <div onclick="window.location.href='/quiz'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-file-pen text-[17px]"></i><span class="text-[9px] font-medium">Quiz</span>
      </div>
      
      <div onclick="window.location.href='/flash'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-bolt text-[17px]"></i><span class="text-[9px] font-medium">Flash</span>
      </div>
      
      <div onclick="window.location.href='/leaderboard'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-ranking-star text-[17px]"></i><span class="text-[9px] font-medium">Rank</span>
      </div>
      
      <div onclick="window.location.href='/profile'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-user text-[17px]"></i><span class="text-[9px] font-medium">Profile</span>
      </div>

      <div onclick="window.location.href='/extractor'" class="dock-item active relative flex flex-col items-center gap-0.5 rounded-full px-2 py-1.5 cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-wand-magic-sparkles text-[17px]"></i><span class="text-[9px] font-medium">Notes</span>
      </div>
    </div>
  </nav>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
    const $ = (id) => document.getElementById(id);
    const haptic = (t) => { if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} } };

    /* --- Theme Manager --- */
    (function initTheme() {
      const saved = localStorage.getItem('h4r_theme');
      if (saved === 'light') document.documentElement.classList.replace('dark', 'light');
      syncThemeIcon();
    })();
    
    function syncThemeIcon() {
      const light = document.documentElement.classList.contains('light');
      $('themeToggle').innerHTML = light ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f3f4f8' : '#050509');
    }
    
    $('themeToggle').addEventListener('click', () => {
      const root = document.documentElement;
      root.classList.contains('dark') ? root.classList.replace('dark', 'light') : root.classList.replace('light', 'dark');
      localStorage.setItem('h4r_theme', root.classList.contains('light') ? 'light' : 'dark');
      syncThemeIcon();
      haptic('light');
    });

    /* --- State & Navigation Manager --- */
    let navHistory = []; 
    let currentPdfUrlsDict = {};
    let activePdfUrl = '';

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showLoading(msg) {
      $('dataGrid').innerHTML = '';
      $('emptyState').classList.add('hidden');
      $('searchContainer').classList.add('hidden');
      $('searchInput').value = '';
      $('loadingText').textContent = msg;
      $('loadingBlock').classList.remove('hidden');
      $('loadingBlock').classList.add('flex');
    }

    function hideLoading() {
      $('loadingBlock').classList.add('hidden');
      $('loadingBlock').classList.remove('flex');
    }

    function updateHeader(state) {
      if(state.step === 'groups') {
        $('navBar').classList.add('hidden');
        $('navBar').classList.remove('flex');
      } else {
        $('navBar').classList.remove('hidden');
        $('navBar').classList.add('flex');
        $('currentStepLabel').textContent = state.label;
        $('currentStepTitle').textContent = state.title;
      }
    }

    /* --- Live Search Engine --- */
    function filterItems() {
      let query = $('searchInput').value.toLowerCase().trim();
      let items = document.querySelectorAll('.searchable-item');
      let headers = document.querySelectorAll('.section-header');
      let hasVisible = false;

      // Hide section headers if user is typing
      headers.forEach(h => h.style.display = query.length > 0 ? 'none' : 'block');

      items.forEach(item => {
        let title = item.getAttribute('data-title') || '';
        if (title.includes(query)) {
          item.style.display = 'flex';
          hasVisible = true;
        } else {
          item.style.display = 'none';
        }
      });

      if (!hasVisible && items.length > 0) {
        $('emptyState').classList.remove('hidden');
        $('emptyState').classList.add('flex');
        $('emptyStateText').textContent = `No results found for "${query}"`;
      } else {
        $('emptyState').classList.add('hidden');
        $('emptyState').classList.remove('flex');
        $('emptyStateText').textContent = "There are no notes available in this section.";
      }
    }

    /* --- Step 1: Load Groups --- */
    async function fetchGroups() {
      showLoading("Fetching Exam Categories...");
      updateHeader({ step: 'groups' });
      try {
        const res = await fetch('/api/study/groups');
        const data = await res.json();
        hideLoading();
        
        if(!data.groups || data.groups.length === 0) {
          $('emptyState').classList.remove('hidden');
          $('emptyState').classList.add('flex');
          return;
        }

        let html = '';
        data.groups.forEach(g => {
          let title = g.properties?.title || 'Unknown Group';
          html += `
            <button data-title="${escapeHtml(title).toLowerCase()}" onclick="navigate('subjects', '${g._id}', '${escapeHtml(title)}')" class="searchable-item glass card-press flex w-full items-center gap-4 rounded-2xl p-4 text-left">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-indigo-neon/10 text-indigo-soft text-xl">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>
              <div class="min-w-0 flex-1">
                <p class="truncate text-[15px] font-bold">${escapeHtml(title)}</p>
                <p class="text-xs text-muted mt-0.5"><i class="fa-solid fa-list-ol mr-1"></i>${g.questionCount || 0} Assets</p>
              </div>
              <i class="fa-solid fa-chevron-right text-xs text-muted"></i>
            </button>`;
        });
        $('dataGrid').innerHTML = html;
        $('searchContainer').classList.remove('hidden');
      } catch (err) {
        hideLoading();
        $('dataGrid').innerHTML = `<p class="text-center text-red-400 font-bold mt-4">Error fetching groups.</p>`;
      }
    }

    /* --- Step 2: Load Subjects --- */
    async function fetchSubjects(groupId) {
      showLoading("Fetching Subjects...");
      try {
        const res = await fetch(`/api/study/subjects?group_id=${groupId}`);
        const data = await res.json();
        hideLoading();

        if(!data.subjects || data.subjects.length === 0) {
          $('emptyState').classList.remove('hidden');
          $('emptyState').classList.add('flex');
          return;
        }

        let html = '';
        data.subjects.forEach(s => {
          let title = s.properties?.title || 'Subject';
          let count = s.meta?.noteCount || 0;
          html += `
            <button data-title="${escapeHtml(title).toLowerCase()}" onclick="navigate('chapters', '${s._id}', '${escapeHtml(title)}')" class="searchable-item glass card-press flex w-full items-center gap-4 rounded-2xl p-4 text-left">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-emerald-neon/10 text-emerald-soft text-xl">
                <i class="fa-solid fa-book"></i>
              </div>
              <div class="min-w-0 flex-1">
                <p class="truncate text-[15px] font-bold">${escapeHtml(title)}</p>
                <p class="text-xs text-muted mt-0.5"><i class="fa-solid fa-file-pdf mr-1"></i>${count} Notes</p>
              </div>
              <i class="fa-solid fa-chevron-right text-xs text-muted"></i>
            </button>`;
        });
        $('dataGrid').innerHTML = html;
        $('searchContainer').classList.remove('hidden');
      } catch (err) {
        hideLoading();
        $('dataGrid').innerHTML = `<p class="text-center text-red-400 font-bold mt-4">Error fetching subjects.</p>`;
      }
    }

    /* --- Step 3: Load Chapters --- */
    async function fetchChapters(subjectId) {
      showLoading("Fetching Chapters...");
      try {
        const res = await fetch(`/api/study/chapters?subject_id=${subjectId}`);
        const data = await res.json();
        hideLoading();

        if(!data.chapters || data.chapters.length === 0) {
          $('emptyState').classList.remove('hidden');
          $('emptyState').classList.add('flex');
          return;
        }

        let html = '';
        data.chapters.forEach(c => {
          let title = c.properties?.title || 'Chapter';
          let count = c.meta?.noteCount || 0;
          html += `
            <button data-title="${escapeHtml(title).toLowerCase()}" onclick="navigate('notes', '${c._id}', '${escapeHtml(title)}')" class="searchable-item glass card-press flex w-full items-center gap-4 rounded-2xl p-4 text-left">
              <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-orange-500/10 text-orange-400 text-lg">
                <i class="fa-solid fa-bookmark"></i>
              </div>
              <div class="min-w-0 flex-1">
                <p class="truncate text-[14px] font-bold">${escapeHtml(title)}</p>
                <p class="text-[11px] text-muted mt-0.5">${count} PDF Notes Inside</p>
              </div>
              <i class="fa-solid fa-chevron-right text-xs text-muted"></i>
            </button>`;
        });
        $('dataGrid').innerHTML = html;
        $('searchContainer').classList.remove('hidden');
      } catch (err) {
        hideLoading();
        $('dataGrid').innerHTML = `<p class="text-center text-red-400 font-bold mt-4">Error fetching chapters.</p>`;
      }
    }

    /* --- Step 4: Load Notes (Sections) --- */
    async function fetchNotes(chapterId) {
      showLoading("Fetching Notes...");
      try {
        const res = await fetch(`/api/study/notes?chapter_id=${chapterId}`);
        const data = await res.json();
        hideLoading();

        if(!data.sections || data.sections.length === 0) {
          $('emptyState').classList.remove('hidden');
          $('emptyState').classList.add('flex');
          return;
        }

        let html = '';
        data.sections.forEach(sec => {
          let secTitle = sec.properties?.title || '';
          if(secTitle) {
            html += `<h4 class="section-header text-xs font-bold text-indigo-soft uppercase tracking-wider mt-4 mb-2 ml-1">${escapeHtml(secTitle)}</h4>`;
          }
          
          if(sec.notes && sec.notes.length > 0) {
            sec.notes.forEach(note => {
              let combinedTitle = (secTitle + " " + note.name).toLowerCase();
              html += `
              <button data-title="${escapeHtml(combinedTitle)}" onclick="navigate('pdf', '${note._id}', '${escapeHtml(note.name)}')" class="searchable-item glass card-press flex w-full items-center gap-3 rounded-2xl p-3.5 mb-2 text-left border-l-4 border-l-indigo-neon">
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-white/5 text-text text-sm">
                  <i class="fa-solid fa-file-pdf"></i>
                </div>
                <div class="min-w-0 flex-1">
                  <p class="truncate text-[14px] font-semibold">${escapeHtml(note.name)}</p>
                </div>
                <div class="flex items-center gap-1.5 text-[10px] font-bold bg-indigo-neon/15 text-indigo-soft px-3 py-1.5 rounded-lg">
                  <i class="fa-solid fa-expand"></i> READ
                </div>
              </button>`;
            });
          }
        });
        $('dataGrid').innerHTML = html;
        $('searchContainer').classList.remove('hidden');
      } catch (err) {
        hideLoading();
        $('dataGrid').innerHTML = `<p class="text-center text-red-400 font-bold mt-4">Error fetching notes.</p>`;
      }
    }

    /* --- Step 5: Full Screen PDF Viewer Logic --- */
    async function fetchPdf(noteId, title) {
      showLoading("Extracting Multi-Lingual PDF...");
      try {
        const res = await fetch(`/api/study/note-pdf?note_id=${noteId}`);
        const data = await res.json();
        hideLoading();

        if (!res.ok || data.error || !data.pdf_data) {
          $('dataGrid').innerHTML = `<p class="text-center text-red-400 font-bold mt-4">${escapeHtml(data.error || "Failed to extract PDF CDN link.")}</p>`;
          return;
        }
        
        currentPdfUrlsDict = data.pdf_data.urls;
        
        // Priority selection
        let defaultLang = "English";
        if(currentPdfUrlsDict["Hindi"]) defaultLang = "Hindi";
        else if (currentPdfUrlsDict["English"]) defaultLang = "English";
        else defaultLang = Object.keys(currentPdfUrlsDict)[0];

        $('readerTitle').textContent = data.pdf_data.title || title || "Study Note";
        
        // Return to notes view visually so back button works, but open overlay
        $('dataGrid').innerHTML = `<button onclick="openPdfReader('${defaultLang}')" class="glass card-press flex w-full justify-center items-center gap-2 rounded-2xl bg-indigo-neon/10 py-4 text-sm font-bold text-indigo-soft mt-4"><i class="fa-solid fa-book-open"></i> Re-open Reader</button>`;
        
        openPdfReader(defaultLang);

      } catch (err) {
        hideLoading();
        $('dataGrid').innerHTML = `<p class="text-center text-red-400 font-bold mt-4">Error generating PDF viewer.</p>`;
      }
    }

    function renderReaderLanguages(activeLang) {
      const langBox = $('readerLangSelector');
      let langs = Object.keys(currentPdfUrlsDict);
      
      if(langs.length <= 1) {
        langBox.classList.add('hidden');
        return;
      }
      
      langBox.classList.remove('hidden');
      let html = '';
      langs.forEach(lang => {
        let isActive = (lang === activeLang);
        let btnClass = isActive 
          ? 'bg-indigo-neon text-white shadow-md border-indigo-neon' 
          : 'bg-surface/50 text-muted border-border';
        
        html += `
          <button onclick="changeReaderLanguage('${lang}')" class="px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all card-press border ${btnClass}">
            ${lang}
          </button>
        `;
      });
      langBox.innerHTML = html;
    }

    function changeReaderLanguage(lang) {
      haptic('light');
      activePdfUrl = currentPdfUrlsDict[lang];
      // Using Google Docs Viewer for flawless mobile iframe rendering
      const viewerUrl = `https://docs.google.com/gview?url=${encodeURIComponent(activePdfUrl)}&embedded=true`;
      
      $('readerIframe').src = viewerUrl;
      $('readerDownloadBtn').href = activePdfUrl;
      renderReaderLanguages(lang); // update active button styling
    }

    function openPdfReader(lang) {
      haptic('heavy');
      $('bottomDock').style.transform = 'translate(-50%, 150%)'; // Hide bottom dock
      $('pdfReaderScreen').classList.remove('hidden');
      $('pdfReaderScreen').classList.add('flex');
      
      changeReaderLanguage(lang);
    }

    function closePdfReader() {
      haptic('light');
      $('pdfReaderScreen').classList.add('hidden');
      $('pdfReaderScreen').classList.remove('flex');
      $('bottomDock').style.transform = 'translate(-50%, 0)'; // Show bottom dock
      
      // Stop iframe to save memory
      $('readerIframe').src = "";
    }

    /* --- Navigation Core Logic --- */
    function navigate(step, id, title) {
      haptic('sel');

      if(step === 'pdf') {
        // Don't push 'pdf' to history because it's a full-screen overlay
        fetchPdf(id, title);
        return;
      }

      let state = { step: step, id: id, title: title, label: "" };

      if(step === 'groups') {
        navHistory = [state];
        fetchGroups();
      } 
      else if(step === 'subjects') {
        state.label = "Exam Group";
        navHistory.push(state);
        updateHeader(state);
        fetchSubjects(id);
      }
      else if(step === 'chapters') {
        state.label = "Subject";
        navHistory.push(state);
        updateHeader(state);
        fetchChapters(id);
      }
      else if(step === 'notes') {
        state.label = "Chapter";
        navHistory.push(state);
        updateHeader(state);
        fetchNotes(id);
      }
    }

    function goBack() {
      haptic('light');
      if(navHistory.length <= 1) return;
      
      navHistory.pop(); // remove current
      let previousState = navHistory.pop(); // pop previous to re-navigate to it
      
      navigate(previousState.step, previousState.id, previousState.title);
    }

    // Initialize the Explorer on load
    navigate('groups', '', 'All Exams');

  </script>
</body>
</html>
