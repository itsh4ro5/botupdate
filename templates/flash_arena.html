<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flash Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f4f4f5; --bg-surface: #ffffff; --border-subtle: #e4e4e7;
            --text-primary: #09090b; --text-secondary: #71717a; --accent-main: #4f46e5;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --dock-bg: rgba(255, 255, 255, 0.85); --dock-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg-base: #000000; --bg-surface: #111111; --border-subtle: #27272a;
            --text-primary: #fafafa; --text-secondary: #a1a1aa; --accent-main: #6366f1;
            --dock-bg: rgba(24, 24, 27, 0.85); --dock-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background: var(--bg-base); color: var(--text-primary); margin: 0; padding: 0 16px 120px 16px; transition: 0.4s; }
        
        .header-area { padding: 24px 0 20px 0; }
        .header-area h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        
        .bento-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 20px; margin-bottom: 16px; }
        
        .question-text { font-size: 18px; font-weight: 700; margin-bottom: 20px; line-height: 1.4; }
        .option-btn { width: 100%; text-align: left; background: var(--bg-base); border: 2px solid var(--border-subtle); color: var(--text-primary); padding: 16px; border-radius: 16px; margin-bottom: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .option-btn.selected { border-color: var(--accent-main); background: rgba(79, 70, 229, 0.15); }
        .option-btn.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .option-btn.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .btn-primary { width: 100%; background: var(--accent-main); color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-share { width: 100%; background: #27A5E7; color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 800; cursor: pointer; margin-top: 16px; font-size: 16px; display: none; justify-content: center; align-items: center; gap: 8px;}
        .btn-share:active { transform: scale(0.96); }

        .flashcard-box {
            background: rgba(168, 85, 247, 0.1); border: 2px dashed #a855f7; border-radius: 20px;
            padding: 24px 20px; margin-top: 24px; display: none; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .flashcard-box:active { transform: scale(0.96); }
        .flashcard-text { font-size: 16px; font-weight: 800; color: #a855f7; pointer-events: none;}

        .floating-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: max-content; padding: 8px 16px; background: var(--dock-bg); backdrop-filter: blur(24px); border: 1px solid var(--border-subtle); border-radius: 100px; display: flex; gap: 20px; z-index: 9999; box-shadow: var(--dock-shadow); transition: 0.3s;}
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-item i { font-size: 18px; transition: 0.3s; }
        .nav-item.active { background: var(--accent-main); color: white; box-shadow: 0 8px 20px rgba(79, 70, 229, 0.15); transform: translateY(-10px); }
    </style>
</head>
<body data-theme="dark">

    <div class="header-area"><h2>Flash Arena</h2></div>

    <div id="main-content">
        <div style="display: flex; gap: 8px; margin-bottom: 20px;">
            <button onclick="switchTab('today')" id="tab-today" style="flex:1; padding: 12px; border-radius: 12px; background: var(--accent-main); color: white; border: none; font-weight: bold; cursor: pointer;">Today's Arena</button>
            <button onclick="switchTab('vault')" id="tab-vault" style="flex:1; padding: 12px; border-radius: 12px; background: var(--bg-surface); color: var(--text-secondary); border: 1px solid var(--border-subtle); font-weight: bold; cursor: pointer;">Past Vault <i class="fa-solid fa-lock-open"></i></button>
        </div>

        <div id="view-today">
            <div class="bento-card" id="quiz-card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                    <span style="font-size: 12px; font-weight: 800; color: var(--warning); text-transform: uppercase;">🔥 Daily Challenge</span>
                    <span style="font-size: 12px; font-weight: 800; color: var(--text-secondary);" id="date-display">Today</span>
                </div>
                <div class="question-text" id="question-text"><i class="fa-solid fa-spinner fa-spin"></i> Fetching...</div>
                <div id="options-container"></div>
                <button class="btn-primary" id="submit-btn" style="display:none;" onclick="submitAnswer()">Submit Answer</button>
                
                <div class="flashcard-box" id="flashcard-section" onclick="revealAnswer()">
                    <div class="flashcard-text" id="flashcard-content"><i class="fa-solid fa-hand-pointer"></i> Tap to reveal correct answer</div>
                </div>

                <button class="btn-share" id="share-btn" onclick="challengeFriend()">
                    <i class="fa-brands fa-telegram"></i> Share Quiz with Friends
                </button>
            </div>
        </div>

        <div id="view-vault" style="display: none;">
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; text-align:center;"><i class="fa-solid fa-circle-info"></i> Revise past concepts. Quizzes cannot be re-taken.</p>
            <div id="vault-container"></div>
        </div>
    </div>

    <div class="floating-dock">
        <a href="/" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="/explore" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="/quiz" class="nav-item"><i class="fa-solid fa-file-signature"></i></a>
        <a href="/flash" class="nav-item active"><i class="fa-solid fa-bolt"></i></a>
        <a href="/leaderboard" class="nav-item"><i class="fa-solid fa-trophy"></i></a>
        <a href="/profile" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let uid = tg.initDataUnsafe?.user?.id || 9999999;
        let uName = tg.initDataUnsafe?.user?.first_name || "Premium User";
        let selectedOption = null;
        let todayQuestionId = null;
        let correctOptionText = "";
        let flashcardConcept = "";

        window.onload = () => {
            document.body.setAttribute('data-theme', localStorage.getItem('edtech_theme') || 'dark');
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-US', options);
            loadDailyChallenge();
        }

        function switchTab(tab) {
            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            document.getElementById('view-today').style.display = tab === 'today' ? 'block' : 'none';
            document.getElementById('view-vault').style.display = tab === 'vault' ? 'block' : 'none';
            document.getElementById('tab-today').style.background = tab === 'today' ? 'var(--accent-main)' : 'var(--bg-surface)';
            document.getElementById('tab-today').style.color = tab === 'today' ? 'white' : 'var(--text-secondary)';
            document.getElementById('tab-vault').style.background = tab === 'vault' ? 'var(--accent-main)' : 'var(--bg-surface)';
            document.getElementById('tab-vault').style.color = tab === 'vault' ? 'white' : 'var(--text-secondary)';
            if(tab === 'vault') loadVault();
        }

        async function loadDailyChallenge() {
            try {
                let quizRes = await fetch(`/api/daily_quiz/${uid}`);
                let quizData = await quizRes.json();

                if(quizData.error) {
                    document.getElementById('question-text').innerHTML = "No active challenge for today. Check back later!";
                    return;
                }

                if(quizData.already_solved) {
                    document.getElementById('question-text').innerHTML = "🎉 You completed today's challenge!";
                    document.getElementById('share-btn').style.display = 'flex';
                    if(quizData.flashcard) {
                        correctOptionText = "You already know this!";
                        flashcardConcept = quizData.flashcard;
                        document.getElementById('flashcard-section').style.display = 'block';
                    }
                    return;
                }

                todayQuestionId = quizData.id;
                document.getElementById('question-text').innerText = quizData.question;
                
                let optsHtml = '';
                quizData.options.forEach((opt, index) => {
                    optsHtml += `<button class="option-btn" onclick="selectOption(${index}, this)">${opt}</button>`;
                });
                document.getElementById('options-container').innerHTML = optsHtml;

            } catch (e) {}
        }

        function selectOption(index, btnElement) {
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            selectedOption = index;
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            btnElement.classList.add('selected');
            document.getElementById('submit-btn').style.display = 'block';
        }

        async function submitAnswer() {
            if (selectedOption === null) return;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            let submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Checking..."; submitBtn.disabled = true;

            try {
                let res = await fetch(`/api/submit_quiz`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid: uid, name: uName, selected_option: selectedOption })
                });
                let result = await res.json();
                
                let allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(btn => btn.disabled = true);
                submitBtn.style.display = 'none';

                correctOptionText = result.correct_text; 
                flashcardConcept = result.flashcard;
                document.getElementById('flashcard-section').style.display = 'block';
                document.getElementById('share-btn').style.display = 'flex';

            } catch(e) { submitBtn.innerText = "Error. Try again."; submitBtn.disabled = false; }
        }

        function revealAnswer() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            let box = document.getElementById('flashcard-section');
            box.style.background = 'rgba(16, 185, 129, 0.1)';
            box.style.borderColor = 'var(--success)';
            box.style.borderStyle = 'solid';
            box.innerHTML = `<span style="color:var(--success); font-weight:800;">✅ Answer:</span><br><span style="font-weight:600; font-size:15px; color:var(--text-primary);">${correctOptionText}</span><br><br><span style="color:#a855f7; font-weight:800;">💡 Concept:</span><br><span style="font-weight:500; font-size:14px; color:var(--text-primary);">${flashcardConcept}</span>`;
            box.onclick = null; 
        }

        async function loadVault() {
            let vc = document.getElementById('vault-container');
            vc.innerHTML = '<div style="text-align:center; padding:20px;"><i class="fa-solid fa-spinner fa-spin text-xl"></i></div>';
            try {
                let res = await fetch('/api/past_flashcards');
                let data = await res.json();
                if(data.length === 0) {
                    vc.innerHTML = '<div class="bento-card text-center" style="color:var(--text-secondary);">No past flashcards available yet.</div>';
                    return;
                }
                let html = '';
                data.forEach(item => {
                    html += `
                    <div class="bento-card" style="border-left: 4px solid #a855f7;">
                        <span style="font-size:11px; font-weight:800; color:var(--text-secondary);">DAY ${item.day}</span>
                        <p style="font-size:15px; font-weight:700; margin: 8px 0;">${item.question}</p>
                        <p style="font-size:14px; font-weight:600; color:var(--success); margin-bottom:12px;">✅ Ans: ${item.answer}</p>
                        <div style="background:rgba(168,85,247,0.1); padding:12px; border-radius:12px; font-size:13px; font-weight:500; color:var(--text-primary);">
                            <b style="color:#a855f7;">💡 Concept:</b><br> ${item.flashcard}
                        </div>
                    </div>`;
                });
                vc.innerHTML = html;
            } catch(e) { vc.innerHTML = 'Error loading vault.'; }
        }

        function challengeFriend() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            let text = `⚡ I just solved the Daily Flash Challenge on H4R Bot!\n\nCan you beat my score? Challenge yourself now! 👇`;
            let appLink = "https://t.me/H4R_Contact_bot/App";
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(appLink)}&text=${encodeURIComponent(text)}`);
        }
    </script>
</body>
</html>
