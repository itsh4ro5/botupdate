<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Required</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { background-color: #050509; color: white; font-family: 'Outfit', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .glass { background: rgba(20, 22, 27, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); }
    .auth-btn { background: linear-gradient(135deg, #4fc3ff 0%, #22e6c5 100%); color: #000; width: 100%; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; display: inline-block; text-decoration: none; }
    .auth-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="glass w-full max-w-sm rounded-[24px] p-8 text-center shadow-[0_0_50px_rgba(79,195,255,0.15)] mx-4">
    <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-red-500/20 text-red-400 text-3xl shadow-[0_0_20px_rgba(239,68,68,0.2)]">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 class="text-2xl font-black mb-2">Access Denied</h2>
    <p class="text-sm text-gray-400 mb-8">Video play karne ke liye aapko Telegram Session authorize karna hoga.</p>
    
    <div class="bg-blue-500/10 border border-blue-500/20 p-4 rounded-xl mb-6 text-left">
        <p class="text-sm text-blue-300 font-semibold mb-2"><i class="fa-solid fa-circle-info"></i> Kaise karein?</p>
        <ol class="text-xs text-gray-300 space-y-2 list-decimal pl-4 font-medium">
            <li>Neeche button par click karke Bot par jayein.</li>
            <li>Bot ke Main Menu me <b>"Login to Web Player"</b> par click karein.</li>
            <li>Apna number verify karein.</li>
        </ol>
    </div>

    <!-- Replace 'H4R_Bot' with your actual bot username -->
    <a href="https://t.me/H4R_Bot" class="auth-btn">
        <i class="fa-brands fa-telegram text-lg mr-2"></i> Open Telegram Bot
    </a>
  </div>
</body>
</html>
