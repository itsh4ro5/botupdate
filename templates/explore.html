<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Explore Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f4f4f5; --bg-surface: #ffffff; --border-subtle: #e4e4e7;
            --text-primary: #09090b; --text-secondary: #71717a; --accent-main: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.15); --success: #10b981; --warning: #f59e0b;
            --dock-bg: rgba(255, 255, 255, 0.85); --dock-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg-base: #000000; --bg-surface: #111111; --border-subtle: #27272a;
            --text-primary: #fafafa; --text-secondary: #a1a1aa; --accent-main: #6366f1;
            --dock-bg: rgba(24, 24, 27, 0.85); --dock-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background: var(--bg-base); color: var(--text-primary); margin: 0; padding: 0 16px 120px 16px; transition: 0.4s; }
        
        .header-area { display: flex; justify-content: space-between; align-items: center; padding: 24px 0 20px 0; }
        .header-area h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        
        .theme-btn { background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-primary); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .theme-btn:active { transform: scale(0.85); }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none;}
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: 14px; background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: 0.3s;}
        .tab-active { background: var(--accent-main); color: white; border-color: var(--accent-main); }

        .bento-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 20px; margin-bottom: 16px; transition: 0.3s; }
        .section-title { font-size: 18px; font-weight: 800; margin: 0 0 16px 0; color: var(--text-primary); display: flex; align-items: center; gap: 8px;}
        .section-divider { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin: 20px 0 10px 0; }
        
        .item-row { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .item-row:active { transform: scale(0.97); }
        .item-row b { font-size: 15px; font-weight: 700; color: var(--text-primary); display: block;}
        .item-row small { font-size: 12px; color: var(--text-secondary); font-weight: 500; display: block; margin-top: 4px; }
        .paid-type { border-left: 4px solid #a855f7; }

        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; flex-shrink: 0; text-transform: uppercase;}
        .bg-blue { background: rgba(99, 102, 241, 0.15); color: var(--accent-main); }
        .bg-purple { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
        .bg-green { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .bg-gray { background: var(--border-subtle); color: var(--text-secondary); }
        .empty-text { font-size: 13px; font-weight:500; color: var(--text-secondary); font-style: italic; padding: 8px 0; }

        .floating-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: max-content; padding: 8px 16px; background: var(--dock-bg); backdrop-filter: blur(24px); border: 1px solid var(--border-subtle); border-radius: 100px; display: flex; gap: 20px; z-index: 9999; box-shadow: var(--dock-shadow); transition: 0.3s;}
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-item i { font-size: 18px; transition: 0.3s; }
        .nav-item.active { background: var(--accent-main); color: white; box-shadow: 0 8px 20px var(--accent-glow); transform: translateY(-10px); }
    </style>
</head>
<body data-theme="dark">

    <div class="header-area">
        <h2>Explore Hub</h2>
        <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
    </div>

    <div class="bento-card" style="border-left: 4px solid var(--success); background: linear-gradient(145deg, var(--bg-surface), rgba(16, 185, 129, 0.05));">
        <h3 class="section-title"><i class="fa-solid fa-compass" style="color:var(--success);"></i> Discover New Content</h3>
        <p style="color:var(--text-secondary); font-size:14px; margin:0;">Browse through our curated free and premium communities below.</p>
    </div>

    <div class="tabs" id="category-tabs">
        <div style="padding: 10px; color: var(--text-secondary);"><i class="fa-solid fa-spinner fa-spin"></i> Loading Categories...</div>
    </div>

    <div class="bento-card full-width" id="batch-container" style="display: none;">
        <h3 class="section-title" id="current-category-title"><i class="fa-solid fa-layer-group" style="color:var(--accent-main);"></i> Category</h3>
        
        <div class="section-divider" style="margin-top:0;">Free Channels</div>
        <div id="explore-free-list"><p class="empty-text">Loading...</p></div>

        <div class="section-divider">Premium Core</div>
        <div id="explore-paid-list"><p class="empty-text">Loading...</p></div>
    </div>

    <div id="loading-state" style="text-align: center; padding: 40px; color: var(--text-secondary);">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:30px; color:var(--accent-main); margin-bottom:10px;"></i>
        <br>Syncing Explore Hub...
    </div>

    <div class="floating-dock">
        <a href="/" class="nav-item"><i class="fa-solid fa-house"></i></a>
        <a href="/explore" class="nav-item active"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="/quiz" class="nav-item"><i class="fa-solid fa-file-signature"></i></a>
        <a href="/flash" class="nav-item"><i class="fa-solid fa-bolt"></i></a>
        <a href="/leaderboard" class="nav-item"><i class="fa-solid fa-trophy"></i></a>
        <a href="/profile" class="nav-item"><i class="fa-solid fa-user"></i></a>
    </div>

    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let uid = tg.initDataUnsafe?.user?.id || 9999999;
        let globalExploreData = {};
        
        window.onload = () => {
            let savedTheme = localStorage.getItem('edtech_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById("theme-icon").className = savedTheme === 'dark' ? "fa-solid fa-moon" : "fa-solid fa-sun";
            
            fetchExploreData();
        }

        function toggleTheme() {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            let theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('edtech_theme', theme);
            document.getElementById("theme-icon").className = theme === 'dark' ? "fa-solid fa-moon" : "fa-solid fa-sun";
        }

        async function fetchExploreData() {
            try {
                let res = await fetch('/api/explore/' + uid);
                let data = await res.json();
                
                globalExploreData = data.explore_data;
                let categories = Object.keys(globalExploreData);
                
                if (categories.length === 0) {
                    document.getElementById('loading-state').innerHTML = "No batches available right now.";
                    return;
                }

                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('batch-container').style.display = 'block';

                // Render Category Tabs
                let tabsHtml = '';
                categories.forEach((cat, index) => {
                    let activeClass = index === 0 ? 'tab-active' : '';
                    tabsHtml += `<div class="tab-btn ${activeClass}" onclick="switchCategory('${cat}', this)">${cat}</div>`;
                });
                document.getElementById('category-tabs').innerHTML = tabsHtml;

                // Load first category by default
                switchCategory(categories[0], document.querySelector('.tab-btn.tab-active'));

            } catch (e) {
                document.getElementById('loading-state').innerHTML = '<span style="color:red;">Error loading Explore Hub.</span>';
            }
        }

        function switchCategory(categoryName, btnElement) {
            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            
            // Handle active tab styling
            if(btnElement) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
                btnElement.classList.add('tab-active');
            }

            document.getElementById('current-category-title').innerHTML = `<i class="fa-solid fa-layer-group" style="color:var(--accent-main);"></i> ${categoryName}`;

            let catData = globalExploreData[categoryName];
            
            // Render Free Batches
            let freeHtml = catData.free.length > 0 ? catData.free.map(b => {
                let isJoined = b.status.includes("Joined");
                let badgeClass = isJoined ? "bg-green" : "bg-blue";
                return `<div class="item-row" onclick="openBatch('${b.id}')">
                            <div><b>${b.name}</b><small>Free Access</small></div>
                            <span class="badge ${badgeClass}">${b.status}</span>
                        </div>`;
            }).join("") : `<p class="empty-text">No free batches in this category.</p>`;
            document.getElementById("explore-free-list").innerHTML = freeHtml;

            // Render Paid Batches
            let paidHtml = catData.paid.length > 0 ? catData.paid.map(b => {
                let isJoined = b.status.includes("Access") || b.status.includes("Joined");
                let isDemo = b.status.includes("Demo");
                let badgeClass = isJoined ? "bg-purple" : (isDemo ? "bg-warning" : "bg-gray");
                return `<div class="item-row paid-type" onclick="openBatch('${b.id}')">
                            <div><b>${b.name}</b><small>Premium Resource</small></div>
                            <span class="badge ${badgeClass}">${b.status}</span>
                        </div>`;
            }).join("") : `<p class="empty-text">No premium batches in this category.</p>`;
            document.getElementById("explore-paid-list").innerHTML = paidHtml;
        }

        function openBatch(chatId) {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            // Explore se bhi click karne par Telegram chat direct open hogi
            // Agar joined nahi hoga, toh Telegram handle kar lega error/join request
            tg.openTelegramLink("https://t.me/c/" + String(chatId).replace("-100", "") + "/1");
        }
    </script>
</body>
</html>
