<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050509" />
  <title>H4R — Profile</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'system-ui', 'sans-serif'] },
          colors: {
            ink: '#050509',
            surface: '#0d0d16',
            indigo: { neon: '#6366f1', soft: '#818cf8' },
            emerald: { neon: '#10b981', soft: '#34d399' },
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --bg: #050509;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-strong: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f7;
      --muted: #8b8b9e;
      --indigo: #6366f1;
      --emerald: #10b981;
    }

    html.light {
      --bg: #f3f4f8;
      --surface: rgba(10, 10, 25, 0.03);
      --surface-strong: rgba(10, 10, 25, 0.05);
      --border: rgba(10, 10, 25, 0.08);
      --text: #10101c;
      --muted: #5b5b6b;
    }

    * { 
      -webkit-tap-highlight-color: transparent; 
      -webkit-touch-callout: none; /* Long press popup hide karega iOS pe */
      user-select: none; /* Text selection band karega */
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ambient neon glow behind content */
    .aurora::before {
      content: '';
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.22), transparent 65%);
      filter: blur(30px);
      z-index: 0;
      pointer-events: none;
    }
    .aurora::after {
      content: '';
      position: fixed;
      bottom: -120px;
      right: -80px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.16), transparent 65%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card-press { transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease; }
    .card-press:active { transform: scale(0.965); }

    .text-muted { color: var(--muted); }

    /* dock */
    .dock {
      background: rgba(13, 13, 22, 0.72);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }
    html.light .dock { background: rgba(255, 255, 255, 0.78); }

    .dock-item { transition: color 0.2s ease, transform 0.2s ease; }
    .dock-item.active { color: var(--indigo); }
    .dock-item.active .dock-glow { opacity: 1; transform: scale(1); }
    .dock-glow {
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 0 18px 2px rgba(99, 102, 241, 0.55);
    }

    /* scroll rows */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* shimmer skeletons */
    .skel {
      background: linear-gradient(100deg, rgba(255,255,255,0.04) 30%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.04) 70%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite linear;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: floatUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

    .ring-conic {
      background: conic-gradient(from 180deg, var(--indigo), var(--emerald), var(--indigo));
    }
  </style>
</head>

<body class="aurora min-h-screen pb-32">
  <div class="relative z-10 mx-auto w-full max-w-md px-5 pt-6">

    <!-- ===== Header ===== -->
    <header class="flex items-center justify-between reveal">
      <div>
        <p class="text-xs text-muted">Your learning identity</p>
        <h1 class="-mt-0.5 flex items-center gap-2 text-xl font-bold leading-tight">
          <i class="fa-solid fa-user-astronaut text-indigo-soft"></i> My Profile
        </h1>
      </div>
      <button id="themeToggle" aria-label="Toggle theme"
        class="glass card-press flex h-10 w-10 items-center justify-center rounded-full text-base">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <!-- ===== Profile Hero ===== -->
    <section class="reveal mt-8 flex flex-col items-center text-center" style="animation-delay:.05s">
      <div class="relative mb-4 h-[104px] w-[104px] shrink-0">
        <div class="ring-conic absolute inset-0 rounded-[28px] opacity-90 animate-[spin_4s_linear_infinite]"></div>
        <div class="absolute inset-[3px] rounded-[26px] bg-[#181826] overflow-hidden">
            <img id="avatar" alt="Your avatar" class="h-full w-full object-cover" src="" />
        </div>
      </div>
      <h2 id="userName" class="text-2xl font-bold tracking-tight">
        <span class="skel inline-block h-7 w-40 rounded-md"></span>
      </h2>
      <p class="mt-1 flex items-center justify-center gap-2 text-sm font-medium text-muted">
        <i class="fa-solid fa-id-badge"></i> <span id="userId"><span class="skel inline-block h-4 w-24 rounded-md"></span></span>
      </p>
    </section>

    <!-- ===== Gamification Bento Grid ===== -->
    <section class="reveal mt-8 grid grid-cols-2 gap-3" style="animation-delay:.1s">
      <!-- Accuracy -->
      <div class="glass card-press relative overflow-hidden rounded-3xl p-5">
        <div class="absolute -right-4 -top-4 h-16 w-16 rounded-full bg-emerald-neon/10 blur-xl"></div>
        <i class="fa-solid fa-crosshairs mb-3 text-2xl text-emerald-soft"></i>
        <p id="statAccuracy" class="text-3xl font-black tracking-tight"><span class="skel inline-block h-8 w-16 rounded-md"></span></p>
        <p class="mt-1 text-[11px] font-bold uppercase tracking-wider text-muted">Hit Accuracy</p>
      </div>
      
      <!-- Points -->
      <div class="glass card-press relative overflow-hidden rounded-3xl p-5">
        <div class="absolute -right-4 -top-4 h-16 w-16 rounded-full bg-yellow-400/10 blur-xl"></div>
        <i class="fa-solid fa-star mb-3 text-2xl text-yellow-400"></i>
        <p id="statPoints" class="text-3xl font-black tracking-tight"><span class="skel inline-block h-8 w-16 rounded-md"></span></p>
        <p class="mt-1 text-[11px] font-bold uppercase tracking-wider text-muted">Total Points</p>
      </div>

      <!-- Streak -->
      <div class="glass card-press relative overflow-hidden rounded-3xl p-5">
        <div class="absolute -right-4 -top-4 h-16 w-16 rounded-full bg-orange-500/10 blur-xl"></div>
        <i class="fa-solid fa-fire mb-3 text-2xl text-orange-400"></i>
        <p id="statStreak" class="text-3xl font-black tracking-tight"><span class="skel inline-block h-8 w-12 rounded-md"></span></p>
        <p class="mt-1 text-[11px] font-bold uppercase tracking-wider text-muted">Day Streak</p>
      </div>

      <!-- Challenges -->
      <div class="glass card-press relative overflow-hidden rounded-3xl p-5">
        <div class="absolute -right-4 -top-4 h-16 w-16 rounded-full bg-indigo-neon/10 blur-xl"></div>
        <i class="fa-solid fa-layer-group mb-3 text-2xl text-indigo-soft"></i>
        <p id="statTests" class="text-3xl font-black tracking-tight"><span class="skel inline-block h-8 w-12 rounded-md"></span></p>
        <p class="mt-1 text-[11px] font-bold uppercase tracking-wider text-muted">Challenges Done</p>
      </div>
    </section>

    <!-- ===== Earned Badges ===== -->
    <section class="reveal mt-3" style="animation-delay:.15s">
      <div class="glass rounded-3xl p-5">
        <div class="mb-3 flex items-center justify-between">
          <h3 class="flex items-center gap-2 text-sm font-bold text-indigo-soft">
            <i class="fa-solid fa-medal"></i> Earned Badges
          </h3>
        </div>
        <div id="badgeList" class="flex flex-wrap gap-2">
            <div class="skel h-8 w-24 rounded-full"></div>
            <div class="skel h-8 w-32 rounded-full"></div>
        </div>
      </div>
    </section>

    <!-- ===== Share Profile ===== -->
    <section class="reveal mt-5" style="animation-delay:.2s">
      <button id="shareBtn" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-indigo-600 to-indigo-neon py-4 text-sm font-bold text-white shadow-lg shadow-indigo-600/25 card-press">
        <i class="fa-solid fa-share-nodes"></i> Share My Profile
      </button>
    </section>

  </div>

  <!-- ===== Floating Bottom Dock ===== -->
  <nav class="fixed bottom-4 left-1/2 z-30 -translate-x-1/2" oncontextmenu="return false;">
    <div class="dock flex items-center gap-1 rounded-full px-2 py-2">
      <div onclick="window.location.href='/'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-house text-[17px]"></i><span class="text-[9px] font-medium">Home</span>
      </div>
      
      <div onclick="window.location.href='/explore'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-compass text-[17px]"></i><span class="text-[9px] font-medium">Explore</span>
      </div>
      
      <div onclick="window.location.href='/quiz'" class="dock-item active relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-file-pen text-[17px]"></i><span class="text-[9px] font-medium">Quiz</span>
      </div>
      
      <div onclick="window.location.href='/flash'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-bolt text-[17px]"></i><span class="text-[9px] font-medium">Flash</span>
      </div>
      
      <div onclick="window.location.href='/leaderboard'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-ranking-star text-[17px]"></i><span class="text-[9px] font-medium">Rank</span>
      </div>
      
      <div onclick="window.location.href='/profile'" class="dock-item relative flex flex-col items-center gap-0.5 rounded-full px-3 py-1.5 text-muted cursor-pointer">
        <span class="dock-glow absolute -top-1 h-1.5 w-1.5 rounded-full bg-indigo-neon"></span>
        <i class="fa-solid fa-user text-[17px]"></i><span class="text-[9px] font-medium">Profile</span>
      </div>
    </div>
  </nav>

  <script>
    /* ============================================================
       H4R Profile — Vanilla JS controller
       API: GET /api/profile_stats/{uid}
       ============================================================ */
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

    const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
    const MY_UID = tgUser && tgUser.id ? tgUser.id : 123456789;

    // 🔥 CHECK IF VIEWING SOMEONE ELSE'S PROFILE
    const urlParams = new URLSearchParams(window.location.search);
    const TARGET_UID = urlParams.get('view') ? urlParams.get('view') : MY_UID;
    const isOwnProfile = (TARGET_UID == MY_UID);

    const UID = TARGET_UID; // Ab tumhara baaki saara code automatically isi UID ko use karega!
    
    const FALLBACK_NAME = tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || 'Guest' : 'Guest';
    const BOT_USERNAME = 'H4R_Contact_bot'; 

    const $ = (id) => document.getElementById(id);
    let userStats = { points: 0, accuracy: 0 };

    /* ---------- Theme toggle (shared behaviour) ---------- */
    (function initTheme() {
      const saved = localStorage.getItem('h4r_theme');
      if (saved === 'light') document.documentElement.classList.replace('dark', 'light');
      syncThemeIcon();
    })();
    
    function syncThemeIcon() {
      const light = document.documentElement.classList.contains('light');
      $('themeToggle').innerHTML = light ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f3f4f8' : '#050509');
    }
    
    $('themeToggle').addEventListener('click', () => {
      const root = document.documentElement;
      root.classList.contains('dark') ? root.classList.replace('dark', 'light') : root.classList.replace('light', 'dark');
      localStorage.setItem('h4r_theme', root.classList.contains('light') ? 'light' : 'dark');
      syncThemeIcon();
      if (tg) try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    });

    /* ---------- Avatar Logic ---------- */
    $('avatar').src = `/api/user/avatar/${UID}`;
    $('avatar').onerror = () => {
      $('avatar').src =
        'data:image/svg+xml;utf8,' +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104"><rect width="104" height="104" fill="%23181826"/><text x="50%" y="54%" font-size="44" font-weight="bold" fill="%236366f1" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">' +
            (tgUser && tgUser.first_name ? tgUser.first_name[0].toUpperCase() : 'H') +
            '</text></svg>'
        );
    };

    /* ---------- Render Stats ---------- */
    function renderProfile(data) {
        userStats.points = data.points || 0;
        userStats.accuracy = data.accuracy || 0;

        $('userName').textContent = (data.name && data.name !== 'Unknown' && data.name !== 'undefined') ? data.name : FALLBACK_NAME;
        $('userId').textContent = 'ID: ' + UID;

        $('statAccuracy').textContent = `${data.accuracy || 0}%`;
        $('statPoints').textContent = data.points || 0;
        $('statStreak').textContent = data.streak || 0;
        $('statTests').textContent = data.tests_given || 0;

        const badges = data.badges || [];
        if (badges.length > 0) {
            $('badgeList').innerHTML = badges.map(b => 
                `<span class="inline-flex items-center gap-1.5 rounded-full bg-indigo-neon/15 px-3 py-1.5 text-[11px] font-bold uppercase tracking-wide text-indigo-soft border border-indigo-neon/20">
                    <i class="fa-solid fa-award"></i> ${escapeHtml(b)}
                </span>`
            ).join('');
        } else {
            $('badgeList').innerHTML = `<span class="text-sm text-muted italic">No badges yet. Keep learning!</span>`;
        }
    }

    /* ---------- Share / Challenge Button Logic ---------- */
    if (!isOwnProfile) {
        // Agar dusre ki profile hai, toh "Challenge" button dikhao
        let btn = $('shareBtn');
        btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Challenge this Player`;
        btn.classList.replace('from-indigo-600', 'from-emerald-500');
        btn.classList.replace('to-indigo-neon', 'to-emerald-neon');
        btn.classList.replace('shadow-indigo-600/25', 'shadow-emerald-500/25');
        btn.onclick = () => { window.location.href = '/flash'; };
    } else {
        // Agar khud ki profile hai, toh apna special link share karo
        $('shareBtn').addEventListener('click', () => {
          if (tg) try { tg.HapticFeedback.impactOccurred('medium'); } catch(e){}
          const text = `🔥 I just hit ${userStats.points} Points with ${userStats.accuracy}% Accuracy on H4R Bot!\n\nCan you beat my stats? Tap to view my profile & challenge me! 🚀👇`;
          
          const shareUrl = `https://t.me/${BOT_USERNAME}/App?startapp=profile_${MY_UID}`;
          const url = 'https://t.me/share/url?url=' + encodeURIComponent(shareUrl) + '&text=' + encodeURIComponent(text);
          
          if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
          else window.open(url, '_blank');
        });
    }
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ---------- Fetch Data ---------- */
    async function loadProfile() {
      try {
        const res = await fetch(`/api/profile_stats/${UID}`, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        renderProfile(await res.json());
      } catch (e) {
        // Fallback demo data
        renderProfile({
            name: FALLBACK_NAME,
            points: 1250,
            accuracy: 88,
            streak: 12,
            tests_given: 45,
            badges: ['Novice', 'Quiz Master', 'Study Addict']
        });
      }
    }

    // Initialize
    loadProfile();
  </script>
</body>
</html>
