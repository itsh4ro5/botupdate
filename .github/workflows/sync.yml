name: Sync to Hugging Face Space

on:
  push:
    branches: [main] # Agar aapki branch ka naam 'master' hai, toh ise 'master' kar dein

  # Manual button se run karne ke liye
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
          
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # 👇 NICHE WALI LINE ME APNA HF USERNAME AUR SPACE NAME ZARUR BADLEIN 👇
        run: git push --force https://itsh4r01:$HF_TOKEN@huggingface.co/spaces/itsh4r01/User_manager
